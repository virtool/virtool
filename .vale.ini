StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Virtool

Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Virtool, Google, write-good

# Duplicated by Google.Passive.
write-good.Passive = NO

# Virtool documentation keeps a formal voice and uses domain acronyms freely.
Google.Contractions = NO
Google.Spelling = NO
Google.Acronyms = NO
Google.Semicolons = NO
Google.Parens = NO

# TooWordy is useful as an editorial prompt but too broad for warnings.
write-good.TooWordy = suggestion
Google.Headings = NO
