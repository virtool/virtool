StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Virtool

Packages = Google, write-good

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good

# Duplicated by Google.Passive.
write-good.Passive = NO

# The repository writes em dashes with surrounding spaces.
Google.EmDash = NO

# Virtool documentation keeps a formal voice and uses domain acronyms freely.
Google.Contractions = NO
Google.Acronyms = NO
Google.Semicolons = NO
Google.Parens = NO
