namePrefix: virtool-workflow-

# No kustomize `labels:` block: kustomize only knows the pod-template path for
# builtin kinds, and a ScaledJob keeps its template at
# `spec.jobTargetRef.template`, so `includeTemplates` rendered as a no-op here.
# Each workflow declares its own labels instead.

patches:
  - path: patches/patch-strategic.yaml
    target:
      kind: ScaledJob
  - path: patches/patch-json.yaml
    target:
      kind: ScaledJob

resources:
  - create-sample.yaml
  - create-subtraction.yaml
  - nuvs.yaml
  - pathoscope.yaml
