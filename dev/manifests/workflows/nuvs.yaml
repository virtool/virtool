# `ghcr.io/virtool/ts-nuvs` is published on release, but no tag of this name
# exists in the registry until the first release that carries it. Run this
# ScaledJob under `tilt up -- --nuvs` meanwhile, which builds the image
# locally. The same holds for pathoscope.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: nuvs
  labels:
    app.kubernetes.io/name: nuvs
    app.kubernetes.io/component: workflow
    app.kubernetes.io/part-of: virtool
    app.virtool.ca/workflow-name: nuvs
    app.virtool.ca/workflow-size: large
spec:
  jobTargetRef:
    template:
      metadata:
        labels:
          app.kubernetes.io/name: nuvs
          app.kubernetes.io/component: workflow
          app.kubernetes.io/part-of: virtool
      spec:
        containers:
          - name: workflow-nuvs
            image: ghcr.io/virtool/ts-nuvs:latest
            # VT_MEM is the cap SPAdes is given, so it moves with the memory
            # limit below rather than being sized independently — a value above
            # the limit is an OOMKill rather than a slower assembly.
            env:
              - name: VT_PROC
                value: "2"
              - name: VT_MEM
                value: "6"
              - name: VT_WORKFLOW
                value: nuvs
            resources:
              limits:
                cpu: 3000m
                memory: 7Gi
              requests:
                cpu: 2000m
                memory: 6Gi
  triggers:
    - type: metrics-api
      metadata:
        url: "http://virtool-jobs-api-service.default.svc.cluster.local/jobs/counts"
        valueLocation: "pending.nuvs"
        targetValue: "1"
        activationTargetValue: "0"
