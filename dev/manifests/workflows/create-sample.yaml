apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: create-sample
  labels:
    app.kubernetes.io/name: create-sample
    app.kubernetes.io/component: workflow
    app.kubernetes.io/part-of: virtool
    app.virtool.ca/workflow-name: create-sample
    app.virtool.ca/workflow-size: small
spec:
  jobTargetRef:
    template:
      metadata:
        labels:
          app.kubernetes.io/name: create-sample
          app.kubernetes.io/component: workflow
          app.kubernetes.io/part-of: virtool
      spec:
        containers:
          - name: workflow-create-sample
            image: ghcr.io/virtool/ts-create-sample:latest
            env:
              - name: VT_PROC
                value: "2"
              - name: VT_MEM
                value: "4"
              - name: VT_WORKFLOW
                value: create_sample
            resources:
              limits:
                cpu: 2500m
                memory: 5Gi
              requests:
                cpu: 1500m
                memory: 4Gi
  triggers:
    - type: metrics-api
      metadata:
        url: "http://virtool-jobs-api-service.default.svc.cluster.local/jobs/counts"
        valueLocation: "pending.create_sample"
        targetValue: "1"
        activationTargetValue: "0"
