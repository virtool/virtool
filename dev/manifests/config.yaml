# The Postgres URL and Azurite credentials every TypeScript service and
# workflow shares. Loaded as a plain manifest rather than a
# `configMapGenerator` because the three kustomizations that consume it
# (`web`, `virtool`, `workflows`) render independently, so a generator would
# produce three hash-suffixed copies instead of one shared object.
#
# The migration Job uses this too. Its tasks-image migrator reads
# `VT_POSTGRES_URL` and ignores the storage settings.
#
# These are Azurite's well-known public dev credentials, not secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: virtool-env
  labels:
    app.kubernetes.io/name: env
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: virtool
data:
  VT_DEV_SERVER_ALLOWED_HOST: "virtool.local"
  VT_POSTGRES_URL: "postgres://virtool:virtool@postgres.default.svc.cluster.local:5432/virtool"
  VT_STORAGE_BACKEND: "azure"
  VT_STORAGE_AZURE_ACCOUNT: "devstoreaccount1"
  VT_STORAGE_AZURE_CONTAINER: "virtool"
  VT_STORAGE_AZURE_ACCESS_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
  VT_STORAGE_AZURE_ENDPOINT: "http://azurite.default.svc.cluster.local:10000/devstoreaccount1"
  # A fixed dev-only email master key, like the Azurite credentials above. It
  # lets a dev instance store an encrypted Resend API key; without a real
  # Resend key configured through the app, email stays in its supported
  # unconfigured state.
  VT_EMAIL_MASTER_KEY: "kh+tHF0cfeestLILKMmWwfczAFrKP/92WrobKA/Md6k="
