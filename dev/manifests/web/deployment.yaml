apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: virtool
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: virtool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: virtool
    spec:
      containers:
        - image: ghcr.io/virtool/ui:latest
          name: virtool-web
          command: ["npm", "start"]
          envFrom:
            - configMapRef:
                name: virtool-env
          env:
            - name: VT_UI_PORT
              value: "9900"
            - name: VT_UI_HOST
              value: "0.0.0.0"
          ports:
            - containerPort: 9900
              protocol: TCP
          # The request is a reservation held for the whole life of the pod, and
          # the node has 8 CPU and 16000 MB in total. Reserving production
          # sizing here left no room for a workflow to schedule beside it, so
          # the request is dev-sized and the limit keeps the headroom for an
          # SSR burst or a Vite rebuild.
          resources:
            limits:
              cpu: 4000m
              memory: 3200M
            requests:
              cpu: 500m
              memory: 1Gi
