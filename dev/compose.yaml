x-environment: &environment
  VT_POSTGRES_URL_FILE: /run/virtool-dev/postgres-url
  VT_STORAGE_BACKEND: azure
  VT_STORAGE_AZURE_ACCOUNT: devstoreaccount1
  VT_STORAGE_AZURE_CONTAINER_FILE: /run/virtool-dev/namespace
  VT_STORAGE_AZURE_ACCESS_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
  VT_STORAGE_AZURE_ENDPOINT: http://azurite:10000/devstoreaccount1
  VT_ENCRYPTION_KEY_FILE: /run/secrets/virtool-encryption-key
  VT_AUTH_SECRET_FILE: /run/secrets/virtool-auth-secret
  VT_PUBLIC_ORIGIN_FILE: /run/virtool-dev/public-origin
  VT_UPLOADS_CHUNKED: "true"
  VT_STORAGE_AZURE_UPLOAD_URL_FILE: /run/virtool-dev/public-origin

x-internal-build: &internal-build
  context: ..
  dockerfile: .coasts/Dockerfile
  target: dev-coast

x-internal-volumes: &internal-volumes
  - instance-config:/run/virtool-dev:ro
  - ../apps/internal/src:/repo/apps/internal/src:ro
  - ../packages/archive/src:/repo/packages/archive/src:ro
  - ../packages/bio/src:/repo/packages/bio/src:ro
  - ../packages/contracts/src:/repo/packages/contracts/src:ro
  - ../packages/data/src:/repo/packages/data/src:ro
  - ../packages/logger/src:/repo/packages/logger/src:ro
  - ../packages/ncbi/src:/repo/packages/ncbi/src:ro
  - ../packages/sentry/src:/repo/packages/sentry/src:ro
  - ../packages/service/src:/repo/packages/service/src:ro
  - ../packages/sqlite/src:/repo/packages/sqlite/src:ro
  - ../packages/storage/src:/repo/packages/storage/src:ro
  - ../packages/data/drizzle:/repo/packages/data/drizzle:ro

x-workflow-environment: &workflow-environment
  VT_JOBS_API_URL: http://jobs-api:9950
  VT_TIMEOUT: "120"
  VT_WORK_PATH: /work
  VT_STORAGE_BACKEND: azure
  VT_STORAGE_AZURE_ACCOUNT: devstoreaccount1
  VT_STORAGE_AZURE_CONTAINER_FILE: /run/virtool-dev/namespace
  VT_STORAGE_AZURE_ACCESS_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
  VT_STORAGE_AZURE_ENDPOINT: http://azurite:10000/devstoreaccount1

x-workflow-volumes: &workflow-volumes
  - instance-config:/run/virtool-dev:ro

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: virtool
      POSTGRES_PASSWORD: virtool
      POSTGRES_DB: virtool
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U virtool -d virtool]
      interval: 2s
      timeout: 5s
      retries: 30

  database-init:
    image: postgres:18
    environment:
      PGHOST: postgres
      PGUSER: virtool
      PGPASSWORD: virtool
      PGDATABASE: postgres
    entrypoint: [/bin/sh, /run/virtool-dev/init-coast-data.sh]
    volumes:
      - instance-config:/run/virtool-dev
    depends_on:
      postgres:
        condition: service_healthy

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite --blobHost 0.0.0.0 --location /data --disableProductStyleUrl
    volumes:
      - azurite:/data

  storage-init:
    image: mcr.microsoft.com/azure-cli:2.89.1
    environment:
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for attempt in $$(seq 1 60); do
          if az storage container create --name "$$(cat /run/virtool-dev/namespace)" --output none; then exit 0; fi
          sleep 2
        done
        exit 1
    depends_on:
      azurite:
        condition: service_started
      database-init:
        condition: service_completed_successfully
    volumes:
      - instance-config:/run/virtool-dev:ro

  migration:
    build: *internal-build
    working_dir: /repo/apps/internal
    init: true
    stop_grace_period: 50s
    entrypoint: [/bin/sh, /repo/apps/internal/dev/entrypoint.sh]
    volumes: *internal-volumes
    environment:
      <<: *environment
      VT_MIGRATIONS_PATH: /repo/packages/data/drizzle
    command: [migrate]
    depends_on:
      database-init:
        condition: service_completed_successfully

  jobs-api:
    build: *internal-build
    working_dir: /repo/apps/internal
    init: true
    stop_grace_period: 50s
    entrypoint: [/bin/sh, /repo/apps/internal/dev/entrypoint.sh]
    volumes: *internal-volumes
    command: [serve]
    environment:
      <<: *environment
      VT_JOBS_API_HOST: 0.0.0.0
    ports:
      - "9950:9950"
    depends_on:
      migration:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  tasks:
    build: *internal-build
    working_dir: /repo/apps/internal
    init: true
    stop_grace_period: 50s
    entrypoint: [/bin/sh, /repo/apps/internal/dev/entrypoint.sh]
    volumes: *internal-volumes
    command: [run]
    environment:
      <<: *environment
    depends_on:
      migration:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: .coasts/Dockerfile
      target: dev-coast
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        dev_uid=$$(stat -c %u /repo/apps/web/src)
        dev_gid=$$(stat -c %g /repo/apps/web/src)
        mkdir -p /tmp/virtool-home /repo/apps/web/.tanstack
        chown "$$dev_uid:$$dev_gid" /tmp/virtool-home /repo/apps/web /repo/apps/web/.tanstack /repo/apps/web/node_modules /repo/node_modules
        exec setpriv --reuid="$$dev_uid" --regid="$$dev_gid" --clear-groups env HOME=/tmp/virtool-home pnpm --filter @virtool/web exec vite --host 0.0.0.0 --port 9900 --strictPort
    environment:
      <<: *environment
      VT_DEV_INSTANCE_FILE: /run/virtool-dev/instance
      VT_DEV_SERVER_ALLOWED_HOST_FILE: /run/virtool-dev/hostname
    ports:
      - "9900:9900"
    volumes:
      - instance-config:/run/virtool-dev:ro
      - ../apps/web/src:/repo/apps/web/src
      - ../apps/web/public:/repo/apps/web/public:ro
      - ../packages/archive/src:/repo/packages/archive/src:ro
      - ../packages/bio/src:/repo/packages/bio/src:ro
      - ../packages/contracts/src:/repo/packages/contracts/src:ro
      - ../packages/data/src:/repo/packages/data/src:ro
      - ../packages/logger/src:/repo/packages/logger/src:ro
      - ../packages/ncbi/src:/repo/packages/ncbi/src:ro
      - ../packages/sentry/src:/repo/packages/sentry/src:ro
      - ../packages/service/src:/repo/packages/service/src:ro
      - ../packages/sqlite/src:/repo/packages/sqlite/src:ro
      - ../packages/storage/src:/repo/packages/storage/src:ro
    depends_on:
      migration:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  proxy:
    image: caddy:2.10.2
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export VT_DEV_HOSTNAME="$$(cat /run/virtool-dev/hostname)"
        exec caddy run --config /run/virtool-dev/Caddyfile --adapter caddyfile
    ports:
      - "9443:9443"
    volumes:
      - instance-config:/run/virtool-dev:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started

  workflow-create-sample:
    build:
      context: ..
      target: create-sample
    restart: unless-stopped
    environment:
      <<: *workflow-environment
      VT_IMAGE: virtool-dev/create-sample
      VT_MEM: "4"
      VT_PROC: "2"
      VT_WORKFLOW: create_sample
    volumes: *workflow-volumes
    depends_on:
      jobs-api:
        condition: service_started
    cpus: 2.5
    mem_limit: 5g

  workflow-create-subtraction:
    build:
      context: ..
      target: create-subtraction
    restart: unless-stopped
    environment:
      <<: *workflow-environment
      VT_IMAGE: virtool-dev/create-subtraction
      VT_MEM: "2"
      VT_PROC: "2"
      VT_WORKFLOW: create_subtraction
    volumes: *workflow-volumes
    depends_on:
      jobs-api:
        condition: service_started
    cpus: 2
    mem_limit: 3g

  workflow-pathoscope:
    build:
      context: ..
      target: pathoscope
    restart: unless-stopped
    environment:
      <<: *workflow-environment
      VT_IMAGE: virtool-dev/pathoscope
      VT_MEM: "6"
      VT_PROC: "2"
      VT_WORKFLOW: pathoscope
    volumes: *workflow-volumes
    depends_on:
      jobs-api:
        condition: service_started
    cpus: 3
    mem_limit: 7g

  workflow-nuvs:
    build:
      context: ..
      target: nuvs
    restart: unless-stopped
    environment:
      <<: *workflow-environment
      VT_IMAGE: virtool-dev/nuvs
      VT_MEM: "6"
      VT_PROC: "2"
      VT_WORKFLOW: nuvs
    volumes: *workflow-volumes
    depends_on:
      jobs-api:
        condition: service_started
    cpus: 3
    mem_limit: 7g

volumes:
  instance-config:
  postgres:
  azurite:
  caddy-data:
  caddy-config:
