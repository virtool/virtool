version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10
      cooldown:
          default-days: 1
      ignore:
          - dependency-name: "superagent"
          - dependency-name: "@types/superagent"
          - dependency-name: "nock"
      groups:
          tanstack:
              patterns:
                  - "@tanstack/*"
          sentry:
              patterns:
                  - "@sentry/*"
          testing:
              patterns:
                  - "@testing-library/*"
                  - "@faker-js/*"
                  - "vitest"
                  - "@vitest/*"
                  - "jsdom"
          react:
              patterns:
                  - "react"
                  - "react-dom"
                  - "@types/react"
                  - "@types/react-dom"
                  - "babel-plugin-react-compiler"
          tailwind:
              patterns:
                  - "tailwindcss"
                  - "@tailwindcss/*"
          vite:
              patterns:
                  - "vite"
                  - "@vitejs/*"
          # The passkey plugin's inferred types must resolve to the same
          # SimpleWebAuthn copy as the app's, so these move together.
          auth:
              patterns:
                  - "better-auth"
                  - "@better-auth/*"
                  - "@simplewebauthn/*"
          react-hook-form:
              patterns:
                  - "react-hook-form"
                  - "@hookform/*"
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
      groups:
          actions:
              patterns:
                  - "*"
    # Only the Node base image reaches published images; the other stages
    # compile tools. The Dependabot Changeset workflow adds a patch changeset to
    # each bump, so Node and Debian security fixes ship without waiting for an
    # unrelated change.
    - package-ecosystem: "docker"
      directories:
          - "/apps/*"
      schedule:
          interval: "daily"
      allow:
          - dependency-name: "node"
      ignore:
          - dependency-name: "node"
            update-types: ["version-update:semver-major"]
      groups:
          base-images:
              patterns:
                  - "*"
