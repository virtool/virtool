name: Dependabot Changeset

# Dependabot's Node base-image bumps change only app Dockerfiles, so they carry
# no changeset and would never release. This adds a patch changeset for each
# app whose Dockerfile the pull request changes.
#
# `pull_request_target` gives the token write access to Dependabot's branch.
# The job never installs or runs code from that branch: it reads the diff and
# writes one Markdown file.
on:
    pull_request_target:
        types: [opened, synchronize, reopened]
        branches:
            - "main"

permissions:
    contents: read

jobs:
    changeset:
        name: Dependabot / Changeset
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/docker/')
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0
                  persist-credentials: true
            - name: Write changeset
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  file=".changeset/dependabot-docker-${PR_NUMBER}.md"
                  apps=$(git diff --name-only "$BASE_SHA"...HEAD -- 'apps/*/Dockerfile' | cut -d/ -f2 | sort -u)
                  if [[ -z "$apps" || -f "$file" ]]; then
                      exit 0
                  fi
                  {
                      echo "---"
                      for app in $apps; do
                          echo "\"@virtool/${app}\": patch"
                      done
                      echo "---"
                      echo
                      echo "Update the Node base image."
                  } > "$file"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "$file"
                  git commit -m "chore(deps): add changeset for node base image"
                  git push
