name: Dependabot

# Dependabot writes no changesets, so its npm and Node base-image bumps would
# fail the `Changeset` check and never release. This adds one changeset to each
# pull request, with the pull request title as its summary, rewritten as a
# release note:
#
# - A bump that changes the `package.json` or Dockerfile of a versioned
#   workspace releases a patch of each such workspace.
# - A bump that reaches only the root `package.json` or an ignored workspace,
#   such as a lint tool or the product website, ships nothing, so the changeset
#   is empty.
# - A bump that changes only the lockfile, such as a transitive security
#   update, names no workspace, so it releases every app that ships an image.
#
# `pull_request_target` runs with the base branch's secrets, so the job can
# push to Dependabot's branch. It never installs or runs code from that branch:
# it reads the diff and the changed `package.json` files, and writes one
# Markdown file.
#
# A commit pushed with `GITHUB_TOKEN` never starts CI, so the push is made as
# the `virtool-releaser` GitHub App.
on:
    pull_request_target:
        types: [opened, synchronize, reopened]
        branches:
            - "main"

permissions:
    contents: read

jobs:
    changeset:
        name: Add changeset
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: >-
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            (startsWith(github.event.pull_request.head.ref, 'dependabot/docker/') ||
            startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/'))
        steps:
            - name: Token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASER_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
                  permission-contents: write
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}
                  persist-credentials: true
            - name: Write changeset
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  file=".changeset/dependabot-${PR_NUMBER}.md"
                  if [[ -f "$file" ]]; then
                      exit 0
                  fi
                  ignored=$(jq -r '.ignore[]' .changeset/config.json)
                  # A bare `*` in a git pathspec also matches `/`, so these
                  # patterns reach every manifest and Dockerfile in the tree.
                  manifests=$(
                      git diff --name-only "$BASE_SHA"...HEAD -- \
                          '*package.json' '*Dockerfile'
                  )
                  # Changesets rejects a changeset that names an ignored
                  # workspace. The root `package.json` is not a workspace.
                  packages=$(
                      for manifest in $manifests; do
                          dir=$(dirname "$manifest")
                          if [[ "$dir" != . && -f "$dir/package.json" ]]; then
                              jq -r 'select(.version != null) | .name' "$dir/package.json"
                          fi
                      done |
                          sort -u |
                          grep -vxF -f <(echo "$ignored") || true
                  )
                  if [[ -z "$packages" && -z "$manifests" ]] &&
                      git diff --quiet "$BASE_SHA"...HEAD -- pnpm-lock.yaml; then
                      exit 0
                  fi
                  if [[ -z "$packages" && -z "$manifests" ]]; then
                      packages=$(
                          for dir in apps/*/; do
                              [[ -f "$dir/Dockerfile" ]] && jq -r .name "$dir/package.json"
                          done |
                              grep -vxF -f <(echo "$ignored") || true
                      )
                  fi
                  # Titles read `chore(deps): bump <name> from X to Y` or
                  # `chore(deps): bump the <group> group ...`. Drop the commit
                  # type, capitalize, and quote the package name as code so
                  # Vale doesn't lint it as prose.
                  summary=$(
                      sed -E \
                          -e 's/^[a-z]+(\([^)]*\))?!?: *//' \
                          -e 's/^bump /Bump /' \
                          -e 's/^Bump ([^ ]+)/Bump `\1`/' \
                          -e 's/^Bump `the`/Bump the/' \
                          <<< "$PR_TITLE"
                  )
                  {
                      echo "---"
                      for package in $packages; do
                          echo "\"${package}\": patch"
                      done
                      echo "---"
                      echo
                      echo "${summary}."
                  } > "$file"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "$file"
                  git commit -m "Add changeset"
                  git push
