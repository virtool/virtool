name: Dependabot

# Dependabot writes no changesets, so its npm and Node base-image bumps would
# fail the `Changeset` check and never release. This adds one patch changeset
# for every versioned workspace whose `package.json` or Dockerfile the pull
# request changes, with the pull request title as its summary. A bump that
# changes only the lockfile, such as a transitive security update, names no
# workspace, so it releases every app that ships an image instead.
#
# `pull_request_target` gives the token write access to Dependabot's branch.
# The job never installs or runs code from that branch: it reads the diff and
# the changed `package.json` files, and writes one Markdown file.
#
# The push uses `GITHUB_TOKEN`, so CI runs on the changeset commit wait until a
# maintainer selects **Approve workflows to run**.
on:
    pull_request_target:
        types: [opened, synchronize, reopened]
        branches:
            - "main"

permissions:
    contents: read

jobs:
    changeset:
        name: Changeset
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: >-
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            (startsWith(github.event.pull_request.head.ref, 'dependabot/docker/') ||
            startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/'))
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0
                  persist-credentials: true
            - name: Write changeset
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  file=".changeset/dependabot-${PR_NUMBER}.md"
                  if [[ -f "$file" ]]; then
                      exit 0
                  fi
                  # Changesets rejects a changeset that names an ignored workspace.
                  packages=$(
                      git diff --name-only "$BASE_SHA"...HEAD -- \
                          'apps/*/Dockerfile' 'apps/*/package.json' 'packages/*/package.json' |
                          xargs -r -n1 dirname | sort -u |
                          while read -r dir; do jq -r .name "$dir/package.json"; done |
                          grep -vxF -f <(jq -r '.ignore[]' .changeset/config.json) || true
                  )
                  if [[ -z "$packages" ]] &&
                      git diff --quiet "$BASE_SHA"...HEAD -- pnpm-lock.yaml; then
                      exit 0
                  fi
                  if [[ -z "$packages" ]]; then
                      packages=$(
                          for dir in apps/*/; do
                              [[ -f "$dir/Dockerfile" ]] && jq -r .name "$dir/package.json"
                          done |
                              grep -vxF -f <(jq -r '.ignore[]' .changeset/config.json) || true
                      )
                  fi
                  {
                      echo "---"
                      for package in $packages; do
                          echo "\"${package}\": patch"
                      done
                      echo "---"
                      echo
                      echo "${PR_TITLE}."
                  } > "$file"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "$file"
                  git commit -m "Add changeset"
                  git push
