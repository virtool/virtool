name: Renovate

# Renovate runs here, not as the hosted app, so that its post-upgrade task can
# write the change file in the same commit as each bump. The repository config
# is `.github/renovate.json5`. The settings here are the ones that Renovate
# reads only from the self-hosted configuration.
#
# Renovate pushes and opens pull requests as the `virtool-renovator` GitHub App,
# because a pull request opened with `GITHUB_TOKEN` never starts CI.
on:
    schedule:
        # Each schedule window in the config is four hours long, so a run
        # every two hours reaches each one.
        - cron: "17 */2 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    renovate:
        name: Renovate
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RENOVATOR_CLIENT_ID }}
                  private-key: ${{ secrets.RENOVATOR_PRIVATE_KEY }}
            - name: Renovate
              uses: renovatebot/github-action@v46.3.12
              with:
                  token: ${{ steps.app-token.outputs.token }}
              env:
                  RENOVATE_REPOSITORIES: ${{ github.repository }}
                  RENOVATE_ONBOARDING: "false"
                  RENOVATE_REQUIRE_CONFIG: "required"
                  RENOVATE_ALLOWED_COMMANDS: '["^node scripts/write-renovate-change-file\\.mjs$"]'
