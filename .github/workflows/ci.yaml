name: CI

on:
    push:
        branches:
            - "main"
    pull_request:
        branches:
            - "main"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    REGISTRY: ghcr.io

jobs:
    # -------------------------------------------------------------------------
    # Change detection
    # -------------------------------------------------------------------------
    # Only the workflow-image jobs are filtered. They are the expensive
    # outliers: a libclang-dev install and a cargo build for pathoscope, a
    # from-source SPAdes compile for nuvs, and a tools image pull for both, all
    # carrying long timeouts, on every PR including ones confined to apps/web.
    # Everything else in this file is cheap enough that gating it would cost
    # more in review attention than it saves in runner minutes.
    #
    # The filter step is skipped on `push`, so this job needs no checkout and no
    # base-ref handling for that event: dorny/paths-filter reads the changed
    # files from the pull request API, which only exists on a PR. A skipped step
    # sets no output, and the consumers' `if` reads `push` first.
    changes:
        name: Changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            pull-requests: read
        outputs:
            nuvs-image: ${{ steps.filter.outputs.nuvs-image }}
            pathoscope-crate: ${{ steps.filter.outputs.pathoscope-crate }}
            pathoscope-image: ${{ steps.filter.outputs.pathoscope-image }}
        steps:
            - name: Filter
              id: filter
              if: github.event_name == 'pull_request'
              uses: dorny/paths-filter@v4
              with:
                  # A filter per job, because they do not share inputs:
                  # pathoscope-test runs cargo over the crate and touches no
                  # TypeScript, while the two image builds bundle their app on
                  # the shared root Dockerfile and so take every workspace
                  # package their build stage copies. One shared filter would
                  # run the libclang-and-cargo job on any packages/workflow
                  # change.
                  #
                  # **Every path a build stage COPYs must appear under that
                  # image's filter.** A missing one skips the build on the PR
                  # that breaks it and fails on the subsequent push to main,
                  # where nothing gates it. The two image filters are nearly
                  # identical and are still written out separately: nuvs copies
                  # packages/bio and pathoscope copies packages/pathoscope-core,
                  # and folding them into one would rebuild each image for the
                  # other's inputs.
                  #
                  # This file is in all three so that a change to the jobs
                  # themselves is still gated by them. None uses
                  # ./.github/actions/setup, so that action is not.
                  #
                  # `.dockerignore` is in the image filter: build-pathoscope
                  # builds with `context: .`, so a rule there decides what the
                  # Dockerfile's `COPY packages/pathoscope-core .` can see. It
                  # already carries `**/target` for that crate specifically, and
                  # a rule that excluded the crate would fail the build on main
                  # with nothing having caught it on the PR.
                  filters: |
                      nuvs-image:
                        - '.github/workflows/ci.yaml'
                        - 'apps/nuvs/**'
                        - 'packages/bio/**'
                        - 'packages/contracts/**'
                        - 'packages/logger/**'
                        - 'packages/sentry/**'
                        - 'packages/storage/**'
                        - 'packages/workflow/**'
                        - 'packages/tsconfig.base.json'
                        - 'apps/tsconfig.node.json'
                        - 'apps/*/package.json'
                        - 'packages/*/package.json'
                        - 'package.json'
                        - 'pnpm-workspace.yaml'
                        - 'pnpm-lock.yaml'
                        - 'Dockerfile'
                        - '.dockerignore'
                      pathoscope-crate:
                        - 'packages/pathoscope-core/**'
                        - '.github/workflows/ci.yaml'
                      pathoscope-image:
                        - 'packages/pathoscope-core/**'
                        - '.github/workflows/ci.yaml'
                        - 'apps/pathoscope/**'
                        - 'packages/contracts/**'
                        - 'packages/logger/**'
                        - 'packages/sentry/**'
                        - 'packages/storage/**'
                        - 'packages/workflow/**'
                        - 'packages/tsconfig.base.json'
                        - 'apps/tsconfig.node.json'
                        - 'apps/*/package.json'
                        - 'package.json'
                        - 'pnpm-workspace.yaml'
                        - 'pnpm-lock.yaml'
                        - 'Dockerfile'
                        - '.dockerignore'
                        - '.github/workflows/ci.yaml'

    # -------------------------------------------------------------------------
    # Checks (repo-wide)
    # -------------------------------------------------------------------------
    checks:
        name: Checks
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Biome
              run: pnpm check
            - name: Knip
              run: pnpm knip
            - name: Typescript
              run: pnpm typecheck

    # -------------------------------------------------------------------------
    # Docker images (apps/web, apps/jobs-api, apps/tasks, apps/create-subtraction,
    # apps/pathoscope)
    # -------------------------------------------------------------------------
    build:
        name: ${{ matrix.area }} / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            # Adding an app needs a Dockerfile stage and an entry here;
            # everything else about a new app is generic. Keep this list and the
            # one in release-ghcr in step.
            matrix:
                include:
                    - image: ui
                      target: dist
                      workspace: apps/web
                      area: Web
                    - image: jobs-api
                      target: jobs-api
                      workspace: apps/jobs-api
                      area: Jobs API
                    - image: tasks
                      target: tasks
                      workspace: apps/tasks
                      area: Tasks
                    - image: ts-create-sample
                      target: create-sample
                      workspace: apps/create-sample
                      area: Create Sample
                    - image: ts-create-subtraction
                      target: create-subtraction
                      workspace: apps/create-subtraction
                      area: Create Subtraction
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # The default `docker` driver cannot export a build cache, so the
            # gha cache below needs a docker-container builder.
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build
              uses: docker/build-push-action@v7
              with:
                  target: ${{ matrix.target }}
                  # Scoped per image. The images share the `base` stage but
                  # diverge after it, and an unscoped `mode=max` export would
                  # have each matrix leg overwrite the last one's cache.
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
    # Builds only — there is deliberately no publish counterpart, and adding one
    # is not a gap to fill. `virtool/workflow-pathoscope` is still the repo that
    # builds and releases the pathoscope workflow image, so this repo must not
    # push a pathoscope image on release. That repo publishes
    # `ghcr.io/virtool/pathoscope`; the Dockerfile here targets
    # `ghcr.io/virtool/ts-pathoscope`, so nothing would be overwritten today —
    # but two pipelines shipping the same workflow is the ambiguity to avoid.
    #
    # Restore a publish job when `virtool/workflow-pathoscope` is retired, and
    # settle which image name the cluster pulls in the same change. Note that
    # `publish-ghcr` is also what runs `pnpm -C <workspace> version`, so until
    # this app has a publish entry its `APP_VERSION` is `0.0.0` in every built
    # image — and `workflow_version` is part of every cache key it derives.
    build-pathoscope:
        name: Pathoscope / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        needs: [changes]
        # Unconditional on `push`, deliberately. `release-tag` lists this job in
        # `needs`, and running it on every push to main keeps that gate complete
        # without the skipped-dependency handling
        # (`if: always() && !contains(needs.*.result, 'failure')`) a filtered
        # dependency would otherwise force onto it. PRs get the savings.
        if: github.event_name == 'push' || needs.changes.outputs.pathoscope-image == 'true'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: pathoscope
                  cache-from: type=gha,scope=pathoscope
                  cache-to: type=gha,mode=max,scope=pathoscope

    # -------------------------------------------------------------------------
    # Web (apps/web)
    # -------------------------------------------------------------------------
    web-test:
        name: Web / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project web
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    web-test-server:
        name: Web / Test Server
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project server
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    web-test-a11y:
        name: Web / Accessibility
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Install Playwright Chromium
              run: pnpm --filter @virtool/web exec playwright install --with-deps chromium
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project a11y
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Jobs API (apps/jobs-api)
    # -------------------------------------------------------------------------
    jobs-api-test:
        name: Jobs API / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Its own job rather than part of Packages / Test, for the same
            # reason as Data / Test: the job guard is tested against a real
            # Postgres testcontainer, and pulling that image does not belong in
            # the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/jobs-api test
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Tasks (apps/tasks)
    # -------------------------------------------------------------------------
    tasks-test:
        name: Tasks / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Its own job rather than part of Packages / Test, for the same
            # reason as Data / Test: the probes are tested against a real
            # Postgres testcontainer, and pulling that image does not belong in
            # the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/tasks test
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # NuVs (apps/nuvs)
    # -------------------------------------------------------------------------
    # Build only, and no publish counterpart, for the same reason
    # `build-pathoscope` has none: `virtool/workflow-nuvs` is still the repo that
    # builds and releases the NuVs workflow image. That repo publishes
    # `ghcr.io/virtool/nuvs`; the Dockerfile here targets
    # `ghcr.io/virtool/ts-nuvs`, so nothing would be overwritten today — but two
    # pipelines shipping the same workflow is the ambiguity to avoid.
    #
    # Restore a publish job when `virtool/workflow-nuvs` is retired, and settle
    # which image name the cluster pulls in the same change. Note that
    # `publish-ghcr` is also what runs `pnpm -C <workspace> version`, so until
    # this app has a publish entry its `APP_VERSION` is `0.0.0` in every built
    # image — and `workflow_version` is a field in all three of the cache keys it
    # derives.
    #
    # The 45-minute timeout is longer than pathoscope's 30: this image compiles
    # SPAdes from source, which is the single most expensive thing either
    # workflow build does. It is the first stage in the Dockerfile and depends on
    # nothing else, so a warm layer cache skips it entirely.
    build-nuvs:
        name: NuVs / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        needs: [changes]
        # Unconditional on `push`, deliberately. `release-tag` lists this job in
        # `needs`, and running it on every push to main keeps that gate complete
        # without the skipped-dependency handling
        # (`if: always() && !contains(needs.*.result, 'failure')`) a filtered
        # dependency would otherwise force onto it. PRs get the savings.
        if: github.event_name == 'push' || needs.changes.outputs.nuvs-image == 'true'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: nuvs
                  cache-from: type=gha,scope=nuvs
                  cache-to: type=gha,mode=max,scope=nuvs

    # -------------------------------------------------------------------------
    # Pathoscope (apps/pathoscope, packages/pathoscope-core)
    # -------------------------------------------------------------------------
    pathoscope-test:
        name: Pathoscope / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        needs: [changes]
        # See the note on `build-pathoscope`: filtered on pull requests,
        # unconditional on `push` so the `release-tag` gate stays complete.
        if: github.event_name == 'push' || needs.changes.outputs.pathoscope-crate == 'true'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # hts-sys runs bindgen against htslib's headers and does not fall
            # back to pre-generated bindings, so libclang is required here just
            # as it is in the image build.
            - name: Install libclang
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
            # The `candidates` golden vectors shell out to bowtie2. Without it
            # the harness skips them; VT_REQUIRE_BOWTIE2 below turns that skip
            # into a failure so CI can never quietly stop checking them.
            - name: Install bowtie2
              run: |
                  container=$(docker create ghcr.io/virtool/tools:1.2.0)
                  sudo docker cp "$container:/tools/bowtie2/2.5.4/." /usr/local/bin/
                  docker rm "$container"
                  bowtie2 --version | head -1
            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      packages/pathoscope-core/target
                  key: cargo-${{ runner.os }}-${{ hashFiles('packages/pathoscope-core/Cargo.lock') }}
                  restore-keys: cargo-${{ runner.os }}-
            - name: Format
              run: cargo fmt --check
              working-directory: packages/pathoscope-core
            - name: Test
              run: cargo test
              working-directory: packages/pathoscope-core
              env:
                  VT_REQUIRE_BOWTIE2: "1"

    # -------------------------------------------------------------------------
    # Site (apps/site)
    # -------------------------------------------------------------------------
    site-build:
        name: Site / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Build site
              run: pnpm --filter @virtool/site build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # -------------------------------------------------------------------------
    # Packages (packages/*, excluding Data and Storage below)
    # -------------------------------------------------------------------------
    packages-test:
        name: Packages / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Exclusions rather than an inclusion list, so a new workspace that
            # declares `test` is covered without editing this job. The five
            # excluded here have their own jobs.
            - name: Test
              run: pnpm -r --filter "!@virtool/web" --filter "!@virtool/data" --filter "!@virtool/storage" --filter "!@virtool/jobs-api" --filter "!@virtool/tasks" test

    # -------------------------------------------------------------------------
    # Data (packages/data)
    # -------------------------------------------------------------------------
    data-test:
        name: Data / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Its own job rather than part of Packages / Test, for the same
            # reason as Storage / Test: it starts a Postgres testcontainer, and
            # pulling that image does not belong in the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/data test
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Storage (packages/storage)
    # -------------------------------------------------------------------------
    storage-test:
        name: Storage / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Its own job rather than part of Packages / Test: the integration
            # project starts Garage and Azurite in testcontainers, and pulling
            # those images does not belong in the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/storage test

    # -------------------------------------------------------------------------
    # Release
    # -------------------------------------------------------------------------
    release-tag:
        name: Release / Tag
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs:
            [
                build,
                build-nuvs,
                build-pathoscope,
                checks,
                data-test,
                jobs-api-test,
                packages-test,
                pathoscope-test,
                site-build,
                storage-test,
                tasks-test,
                web-test,
                web-test-a11y,
                web-test-server,
            ]
        if: github.event_name == 'push'
        outputs:
            git-tag: ${{ steps.semantic.outputs.git-tag }}
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Run semantic-release
              id: semantic
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm exec semantic-release
    release-ghcr:
        # No `${{ matrix.image }}` in the name: this job's `if` is false on
        # every PR (it only runs post-merge, on push to main), and GitHub
        # skips a job before expanding its matrix — so a matrix-templated
        # name would render as the literal, unresolved expression on every
        # PR's checks list instead of a real image name.
        name: Release / GHCR
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        if: github.repository_owner == 'Virtool' && github.event_name == 'push' && needs.release-tag.outputs.git-tag != ''
        needs: [release-tag]
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            # Every image shares the repo version and is published every
            # release. Keep in step with the matrix in the build job.
            matrix:
                include:
                    - image: ui
                      target: dist
                      workspace: apps/web
                    - image: jobs-api
                      target: jobs-api
                      workspace: apps/jobs-api
                    - image: tasks
                      target: tasks
                      workspace: apps/tasks
                    - image: ts-create-sample
                      target: create-sample
                      workspace: apps/create-sample
                    - image: ts-create-subtraction
                      target: create-subtraction
                      workspace: apps/create-subtraction
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-tag.outputs.git-tag }}
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
            - name: Set app version from release tag
              run: pnpm -C ${{ matrix.workspace }} version "${{ needs.release-tag.outputs.git-tag }}" --no-git-tag-version
            - name: Login
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract Metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  context: git
                  images: ${{ env.REGISTRY }}/virtool/${{ matrix.image }}
            - name: Build & Push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  target: ${{ matrix.target }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
                  secrets: |
                      sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
