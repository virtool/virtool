name: CI

on:
    push:
        branches:
            - "main"
    pull_request:
        branches:
            - "main"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    REGISTRY: ghcr.io
    NODE_VERSION: 22
    PNPM_VERSION: 11.1.3

jobs:
    build:
        name: Build / ${{ matrix.image }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            # The runtime base differs per image, so it belongs here rather than
            # being branched on inside a step. Adding an app needs a Dockerfile
            # stage and an entry here; everything else about a new app is
            # generic. Keep this list and the one in publish-ghcr in step.
            matrix:
                include:
                    - image: ui
                      target: dist
                      workspace: apps/web
                    - image: jobs-api
                      target: jobs-api
                      workspace: apps/jobs-api
                    - image: ts-create-subtraction
                      target: create-subtraction
                      workspace: apps/create-subtraction
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # The default `docker` driver cannot export a build cache, so the
            # gha cache below needs a docker-container builder.
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build
              uses: docker/build-push-action@v7
              with:
                  target: ${{ matrix.target }}
                  # Scoped per image. The images share the `base` stage but
                  # diverge after it, and an unscoped `mode=max` export would
                  # have each matrix leg overwrite the last one's cache.
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
    # Builds only — there is deliberately no publish counterpart, and adding one
    # is not a gap to fill. `virtool/workflow-pathoscope` is still the repo that
    # builds and releases the pathoscope workflow image, so this repo must not
    # push a pathoscope image on release. That repo publishes
    # `ghcr.io/virtool/pathoscope`; the Dockerfile here targets
    # `ghcr.io/virtool/ts-pathoscope`, so nothing would be overwritten today —
    # but two pipelines shipping the same workflow is the ambiguity to avoid,
    # and the port is not finished. `apps/workflow-pathoscope` holds only a
    # Dockerfile.
    #
    # Restore a publish job when `virtool/workflow-pathoscope` is retired, and
    # settle which image name the cluster pulls in the same change.
    build-pathoscope:
        name: Build / Pathoscope
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: apps/workflow-pathoscope/Dockerfile
                  cache-from: type=gha,scope=pathoscope
                  cache-to: type=gha,mode=max,scope=pathoscope
    test-rust:
        name: Test / Rust
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # hts-sys runs bindgen against htslib's headers and does not fall
            # back to pre-generated bindings, so libclang is required here just
            # as it is in the image build.
            - name: Install libclang
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
            # The `candidates` golden vectors shell out to bowtie2. Without it
            # the harness skips them; VT_REQUIRE_BOWTIE2 below turns that skip
            # into a failure so CI can never quietly stop checking them.
            - name: Install bowtie2
              run: |
                  container=$(docker create ghcr.io/virtool/tools:1.2.0)
                  sudo docker cp "$container:/tools/bowtie2/2.5.4/." /usr/local/bin/
                  docker rm "$container"
                  bowtie2 --version | head -1
            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      packages/pathoscope-core/target
                  key: cargo-${{ runner.os }}-${{ hashFiles('packages/pathoscope-core/Cargo.lock') }}
                  restore-keys: cargo-${{ runner.os }}-
            - name: Format
              run: cargo fmt --check
              working-directory: packages/pathoscope-core
            - name: Test
              run: cargo test
              working-directory: packages/pathoscope-core
              env:
                  VT_REQUIRE_BOWTIE2: "1"
    check-biome:
        name: Biome
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Run Biome
              run: pnpm check
    check-knip:
        name: Knip
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Run Knip
              run: pnpm knip
    check-typescript:
        name: Typescript
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: tsc
              run: pnpm typecheck
    test-packages:
        name: Test / Packages
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            # Exclusions rather than an inclusion list, so a new workspace that
            # declares `test` is covered without editing this job. The three
            # excluded here have their own jobs.
            - name: Test
              run: pnpm -r --filter "!@virtool/web" --filter "!@virtool/data" --filter "!@virtool/storage" test
    test-data:
        name: Test / Data
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            # Its own job rather than part of Test / Packages, for the same
            # reason as Test / Storage: it starts a Postgres testcontainer, and
            # pulling that image does not belong in the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/data test
              env:
                  TZ: UTC
    test-storage:
        name: Test / Storage
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            # Its own job rather than part of Test / Packages: the integration
            # project starts Garage and Azurite in testcontainers, and pulling
            # those images does not belong in the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/storage test
    test-web:
        name: Test / Web
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project web
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    test-server:
        name: Test / Server
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project server
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    test-a11y:
        name: Test / Accessibility
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Install Playwright Chromium
              run: pnpm --filter @virtool/web exec playwright install --with-deps chromium
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project a11y
              env:
                  TZ: UTC
    build-site:
        name: Build Site
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Build site
              run: pnpm --filter @virtool/site build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    release:
        name: Publish / Release
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs:
            [
                build,
                build-pathoscope,
                build-site,
                check-biome,
                check-knip,
                check-typescript,
                test-packages,
                test-data,
                test-rust,
                test-storage,
                test-web,
                test-server,
                test-a11y,
            ]
        if: github.event_name == 'push'
        outputs:
            git-tag: ${{ steps.semantic.outputs.git-tag }}
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Run semantic-release
              id: semantic
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm exec semantic-release
    publish-ghcr:
        name: Publish / GHCR / ${{ matrix.image }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        if: github.repository_owner == 'Virtool' && github.event_name == 'push' && needs.release.outputs.git-tag != ''
        needs: [release]
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            # Every image shares the repo version and is published every
            # release. Keep in step with the matrix in the build job.
            matrix:
                include:
                    - image: ui
                      target: dist
                      workspace: apps/web
                    - image: jobs-api
                      target: jobs-api
                      workspace: apps/jobs-api
                    - image: ts-create-subtraction
                      target: create-subtraction
                      workspace: apps/create-subtraction
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release.outputs.git-tag }}
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}
            - name: Set app version from release tag
              run: pnpm -C ${{ matrix.workspace }} version "${{ needs.release.outputs.git-tag }}" --no-git-tag-version
            - name: Login
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract Metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  context: git
                  images: ${{ env.REGISTRY }}/virtool/${{ matrix.image }}
            - name: Build & Push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  target: ${{ matrix.target }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
                  secrets: |
                      sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
