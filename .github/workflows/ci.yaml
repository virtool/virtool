name: CI

on:
    push:
        branches:
            - "main"
    pull_request:
        branches:
            - "main"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    REGISTRY: ghcr.io

jobs:
    # -------------------------------------------------------------------------
    # Change detection
    # -------------------------------------------------------------------------
    # Only the workflow-image jobs are filtered. They are the expensive
    # outliers: a libclang-dev install and a cargo build for pathoscope, a
    # from-source SPAdes compile for nuvs, and a from-source bowtie2, HMMER and
    # samtools build for both, all carrying long timeouts, on every PR including
    # ones confined to apps/web. Everything else in this file is cheap enough
    # that gating it would cost more in review attention than it saves in runner
    # minutes.
    #
    # The filter step is skipped on `push`, so this job needs no checkout and no
    # base-ref handling for that event: dorny/paths-filter reads the changed
    # files from the pull request API, which only exists on a PR. A skipped step
    # sets no output, and the consumers' `if` reads `push` first.
    changes:
        name: Changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            pull-requests: read
        outputs:
            nuvs-image: ${{ steps.filter.outputs.nuvs-image }}
            pathoscope-crate: ${{ steps.filter.outputs.pathoscope-crate }}
            pathoscope-image: ${{ steps.filter.outputs.pathoscope-image }}
            quality-crate: ${{ steps.filter.outputs.quality-crate }}
        steps:
            - name: Filter
              id: filter
              if: github.event_name == 'pull_request'
              uses: dorny/paths-filter@v4
              with:
                  # A filter per job, because they do not share inputs:
                  # pathoscope-test runs cargo over the crate and touches no
                  # TypeScript, while the two image builds bundle their app on
                  # the shared root Dockerfile and so take every workspace
                  # package their build stage copies. One shared filter would
                  # run the libclang-and-cargo job on any packages/workflow
                  # change.
                  #
                  # **Every path a build stage COPYs must appear under that
                  # image's filter.** A missing one skips the build on the PR
                  # that breaks it and fails on the subsequent push to main,
                  # where nothing gates it. Both image filters therefore carry
                  # everything the shared `base` stage copies — including
                  # packages neither app imports today, because `base` copies
                  # them regardless of which target is requested. The two are
                  # still written out separately rather than folded into one:
                  # pathoscope copies packages/pathoscope-core and nuvs does
                  # not, and one shared filter would rebuild each image for the
                  # other's inputs.
                  #
                  # This file is in all three so that a change to the jobs
                  # themselves is still gated by them. None uses
                  # ./.github/actions/setup, so that action is not.
                  #
                  # `.dockerignore` is in the image filter: build-pathoscope
                  # builds with `context: .`, so a rule there decides what the
                  # Dockerfile's `COPY packages/pathoscope-core .` can see. It
                  # already carries `**/target` for that crate specifically, and
                  # a rule that excluded the crate would fail the build on main
                  # with nothing having caught it on the PR.
                  filters: |
                      nuvs-image:
                        - '.github/workflows/ci.yaml'
                        - 'apps/nuvs/**'
                        - 'packages/archive/**'
                        - 'packages/bio/**'
                        - 'packages/contracts/**'
                        - 'packages/data/**'
                        - 'packages/logger/**'
                        - 'packages/ncbi/**'
                        - 'packages/sentry/**'
                        - 'packages/service/**'
                        - 'packages/sqlite/**'
                        - 'packages/storage/**'
                        - 'packages/workflow/**'
                        - 'packages/tsconfig.base.json'
                        - 'apps/tsconfig.node.json'
                        - 'apps/*/package.json'
                        - 'packages/*/package.json'
                        - 'biome.json'
                        - 'package.json'
                        - 'pnpm-workspace.yaml'
                        - 'pnpm-lock.yaml'
                        - 'Dockerfile'
                        - '.dockerignore'
                      # `Dockerfile` because pathoscope-test builds bowtie2 out
                      # of it to run the golden vectors against.
                      pathoscope-crate:
                        - 'packages/pathoscope-core/**'
                        - '.github/workflows/ci.yaml'
                        - 'Dockerfile'
                      pathoscope-image:
                        - '.github/workflows/ci.yaml'
                        - 'apps/pathoscope/**'
                        - 'packages/archive/**'
                        - 'packages/bio/**'
                        - 'packages/contracts/**'
                        - 'packages/data/**'
                        - 'packages/logger/**'
                        - 'packages/ncbi/**'
                        - 'packages/pathoscope-core/**'
                        - 'packages/sentry/**'
                        - 'packages/service/**'
                        - 'packages/sqlite/**'
                        - 'packages/storage/**'
                        - 'packages/workflow/**'
                        - 'packages/tsconfig.base.json'
                        - 'apps/tsconfig.node.json'
                        - 'apps/*/package.json'
                        - 'packages/*/package.json'
                        - 'biome.json'
                        - 'package.json'
                        - 'pnpm-workspace.yaml'
                        - 'pnpm-lock.yaml'
                        - 'Dockerfile'
                        - '.dockerignore'
                      # No `Dockerfile` here, unlike pathoscope-crate. That job
                      # builds bowtie2 out of it to run its goldens against;
                      # this one builds nothing at all — quality-core's
                      # goldens are checked in and frozen, and nothing in that
                      # file is involved in producing them.
                      quality-crate:
                        - 'packages/quality-core/**'
                        - '.github/workflows/ci.yaml'

    # -------------------------------------------------------------------------
    # Checks (repo-wide)
    # -------------------------------------------------------------------------
    checks:
        name: Checks
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Biome
              run: pnpm check
            - name: Knip
              run: pnpm knip
            - name: Typescript
              run: pnpm typecheck

    # -------------------------------------------------------------------------
    # Docker images (apps/web, apps/internal, apps/create-subtraction,
    # apps/pathoscope)
    # -------------------------------------------------------------------------
    build:
        name: ${{ matrix.area }} / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            # Adding an app needs a Dockerfile stage and an entry here;
            # everything else about a new app is generic. Keep this list and the
            # one in release-ghcr in step.
            matrix:
                include:
                    - image: web
                      target: dist
                      workspace: apps/web
                      area: Web
                    - image: internal
                      target: internal
                      workspace: apps/internal
                      area: Internal
                    - image: create-sample
                      target: create-sample
                      workspace: apps/create-sample
                      area: Create Sample
                    - image: create-subtraction
                      target: create-subtraction
                      workspace: apps/create-subtraction
                      area: Create Subtraction
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # The default `docker` driver cannot export a build cache, so the
            # gha cache below needs a docker-container builder.
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build
              uses: docker/build-push-action@v7
              with:
                  target: ${{ matrix.target }}
                  # Scoped per image. The images share the `base` stage but
                  # diverge after it, and an unscoped `mode=max` export would
                  # have each matrix leg overwrite the last one's cache.
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
    # Also published by `release-ghcr` as `ghcr.io/virtool/pathoscope`.
    build-pathoscope:
        name: Pathoscope / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        needs: [changes]
        # Unconditional on `push`, deliberately. `release-tag` lists this job in
        # `needs`, and running it on every push to main keeps that gate complete
        # without the skipped-dependency handling
        # (`if: always() && !contains(needs.*.result, 'failure')`) a filtered
        # dependency would otherwise force onto it. PRs get the savings.
        if: github.event_name == 'push' || needs.changes.outputs.pathoscope-image == 'true'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: pathoscope
                  cache-from: type=gha,scope=pathoscope
                  cache-to: type=gha,mode=max,scope=pathoscope

    # -------------------------------------------------------------------------
    # Web (apps/web)
    # -------------------------------------------------------------------------
    web-test:
        name: Web / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project web
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    web-test-server:
        name: Web / Test Server
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project server
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    web-test-a11y:
        name: Web / Accessibility
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Keyed on the Playwright version rather than the lockfile hash:
            # the browser revision a release pins is this cache's only input, so
            # an unrelated dependency bump must not throw the download away. No
            # `restore-keys` either — a near-miss restore would seed the
            # directory with a revision `install` then downloads past, leaving
            # both in the cache.
            - name: Resolve Playwright version
              id: playwright
              run: echo "version=$(pnpm --filter @virtool/web exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
            # No `--with-deps`. It shells out to `apt-get update && apt-get
            # install`, which carries no timeout of its own: when the runner's
            # Azure mirror goes unreachable apt falls back to
            # archive.ubuntu.com and stalls until the job timeout kills it. The
            # ubuntu-24.04 image ships Chrome and Edge, so Chromium's shared
            # libraries are already present. The step timeout below is a
            # backstop for a slow CDN, not for apt.
            - name: Install Playwright Chromium
              run: pnpm --filter @virtool/web exec playwright install chromium
              timeout-minutes: 5
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project a11y
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Internal (apps/internal)
    # -------------------------------------------------------------------------
    internal-test:
        name: Internal / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Its own job rather than part of Packages / Test, for the same
            # reason as Data & Storage / Test: the job guard and the task probes are tested
            # against a real Postgres testcontainer, and pulling that image does
            # not belong in the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/internal test
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # NuVs (apps/nuvs)
    # -------------------------------------------------------------------------
    # Also published by `release-ghcr` as `ghcr.io/virtool/nuvs`.
    #
    # The 45-minute timeout is longer than pathoscope's 30: this image compiles
    # SPAdes from source, which is the single most expensive thing either
    # workflow build does. It is the first stage in the Dockerfile and depends on
    # nothing else, so a warm layer cache skips it entirely.
    build-nuvs:
        name: NuVs / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        needs: [changes]
        # Unconditional on `push`, deliberately. `release-tag` lists this job in
        # `needs`, and running it on every push to main keeps that gate complete
        # without the skipped-dependency handling
        # (`if: always() && !contains(needs.*.result, 'failure')`) a filtered
        # dependency would otherwise force onto it. PRs get the savings.
        if: github.event_name == 'push' || needs.changes.outputs.nuvs-image == 'true'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: nuvs
                  cache-from: type=gha,scope=nuvs
                  cache-to: type=gha,mode=max,scope=nuvs

    # -------------------------------------------------------------------------
    # Pathoscope (apps/pathoscope, packages/pathoscope-core)
    # -------------------------------------------------------------------------
    pathoscope-test:
        name: Pathoscope / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        needs: [changes]
        # See the note on `build-pathoscope`: filtered on pull requests,
        # unconditional on `push` so the `release-tag` gate stays complete.
        if: github.event_name == 'push' || needs.changes.outputs.pathoscope-crate == 'true'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # hts-sys runs bindgen against htslib's headers and does not fall
            # back to pre-generated bindings, so libclang is required here just
            # as it is in the image build. Unlike the accessibility job's
            # Playwright libraries it cannot simply be dropped, so apt is
            # bounded instead. The runner's mirrorlist puts
            # azure.archive.ubuntu.com first; when that host goes unreachable
            # apt retries it for every index against a two-minute default
            # timeout before falling back to archive.ubuntu.com, which reads as
            # a hang. Rewriting the mirrorlist skips the dead host outright and
            # the acquire options cap what a merely slow one can cost, for the
            # package downloads as well as the index fetch. The step timeout is
            # the backstop for both.
            - name: Install libclang
              timeout-minutes: 5
              run: |
                  if [ -f /etc/apt/apt-mirrors.txt ]; then
                      sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
                  fi
                  printf 'Acquire::Retries "2";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
                      | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libclang-dev
            # The `candidates` golden vectors shell out to bowtie2. Without it
            # the harness skips them; VT_REQUIRE_BOWTIE2 below turns that skip
            # into a failure so CI can never quietly stop checking them. It is
            # built from the root Dockerfile's own target rather than apt, so
            # this job and the workflow images can only ever run the build the
            # goldens were generated against.
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build bowtie2
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: bowtie2
                  outputs: type=local,dest=/tmp/bowtie2
                  cache-from: type=gha,scope=bowtie2
                  cache-to: type=gha,mode=max,scope=bowtie2
            - name: Install bowtie2
              run: |
                  sudo cp /tmp/bowtie2/tools/bowtie2/2.5.4/* /usr/local/bin/
                  bowtie2 --version | head -1
            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      packages/pathoscope-core/target
                  key: cargo-${{ runner.os }}-${{ hashFiles('packages/pathoscope-core/Cargo.lock') }}
                  restore-keys: cargo-${{ runner.os }}-
            - name: Format
              run: cargo fmt --check
              working-directory: packages/pathoscope-core
            - name: Test
              run: cargo test
              working-directory: packages/pathoscope-core
              env:
                  VT_REQUIRE_BOWTIE2: "1"

    # -------------------------------------------------------------------------
    # Quality (packages/quality-core)
    # -------------------------------------------------------------------------
    # Much cheaper than pathoscope-test, and deliberately so: this crate links
    # nothing native, so there is no libclang install, and its goldens are
    # FastQC output checked in rather than something a tool has to be built to
    # produce. Just cargo.
    quality-test:
        name: Quality / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: [changes]
        # See the note on `build-pathoscope`: filtered on pull requests,
        # unconditional on `push` so the `release-tag` gate stays complete.
        if: github.event_name == 'push' || needs.changes.outputs.quality-crate == 'true'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      packages/quality-core/target
                  key: cargo-quality-${{ runner.os }}-${{ hashFiles('packages/quality-core/Cargo.lock') }}
                  restore-keys: cargo-quality-${{ runner.os }}-
            - name: Format
              run: cargo fmt --check
              working-directory: packages/quality-core
            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings
              working-directory: packages/quality-core
            - name: Test
              run: cargo test
              working-directory: packages/quality-core

    # -------------------------------------------------------------------------
    # Site (apps/site)
    # -------------------------------------------------------------------------
    site-build:
        name: Site / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Build site
              run: pnpm --filter @virtool/site build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # -------------------------------------------------------------------------
    # Packages (packages/*, excluding Data and Storage below)
    # -------------------------------------------------------------------------
    packages-test:
        name: Packages / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Exclusions rather than an inclusion list, so a new workspace that
            # declares `test` is covered without editing this job. The four
            # excluded here run in dedicated jobs: web, internal, and the two
            # persistence packages that share Data & Storage / Test.
            - name: Test
              run: pnpm -r --filter "!@virtool/web" --filter "!@virtool/data" --filter "!@virtool/storage" --filter "!@virtool/internal" test

    # -------------------------------------------------------------------------
    # Data and Storage (packages/data, packages/storage)
    # -------------------------------------------------------------------------
    data-storage-test:
        name: Data & Storage / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Its own job rather than part of Packages / Test: data starts a
            # Postgres testcontainer and storage starts Garage and Azurite,
            # and pulling those images does not belong in the fast package
            # loop. The two persistence packages share one job, run with
            # --parallel so their testcontainer pulls overlap despite the
            # data-on-storage dependency, and neither fills the job's
            # wall-clock budget.
            - name: Test
              run: pnpm --parallel --filter @virtool/data --filter @virtool/storage test
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Release
    # -------------------------------------------------------------------------
    release-tag:
        name: Release / Tag
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs:
            [
                build,
                build-nuvs,
                build-pathoscope,
                checks,
                data-storage-test,
                internal-test,
                packages-test,
                pathoscope-test,
                quality-test,
                site-build,
                web-test,
                web-test-a11y,
                web-test-server,
            ]
        if: github.event_name == 'push'
        outputs:
            git-tag: ${{ steps.semantic.outputs.git-tag }}
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # semantic-release resolves the last release from the tags
                  # reachable from the branch; the default shallow checkout has
                  # none, and it would publish 1.0.0 over the live series.
                  fetch-depth: 0
            - name: Setup
              uses: ./.github/actions/setup
            - name: Run semantic-release
              id: semantic
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm exec semantic-release
    release-ghcr:
        # No `${{ matrix.image }}` in the name: this job's `if` is false on
        # every PR (it only runs post-merge, on push to main), and GitHub
        # skips a job before expanding its matrix — so a matrix-templated
        # name would render as the literal, unresolved expression on every
        # PR's checks list instead of a real image name.
        name: Release / GHCR
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        if: github.repository_owner == 'Virtool' && github.event_name == 'push' && needs.release-tag.outputs.git-tag != ''
        needs: [release-tag]
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            # Every image shares the repo version and is published every
            # release. Keep in step with the matrix in the build job.
            matrix:
                include:
                    # Matrix values are evaluated before the job's `env`
                    # context exists, so these are literal `ghcr.io`, not
                    # `${{ env.REGISTRY }}`.
                    - image: web
                      target: dist
                      workspace: apps/web
                      images: ghcr.io/virtool/web
                    - image: internal
                      target: internal
                      workspace: apps/internal
                      images: ghcr.io/virtool/internal
                    # These four names previously came from separate legacy
                    # repositories shipping the Python workflow of the same
                    # name; this repository's release supersedes them.
                    - image: create-sample
                      target: create-sample
                      workspace: apps/create-sample
                      images: ghcr.io/virtool/create-sample
                    - image: create-subtraction
                      target: create-subtraction
                      workspace: apps/create-subtraction
                      images: ghcr.io/virtool/create-subtraction
                    # These two read their gha cache under the same scope
                    # build-pathoscope and build-nuvs write it to (matching
                    # pathoscope-test's bowtie2 scope too), so the release
                    # reuses what those 45/60-minute jobs already produced
                    # rather than rebuilding the Rust crate, the
                    # bioinformatics tools and SPAdes from scratch inside this
                    # job's shared 20-minute timeout.
                    - image: pathoscope
                      target: pathoscope
                      workspace: apps/pathoscope
                      images: ghcr.io/virtool/pathoscope
                    - image: nuvs
                      target: nuvs
                      workspace: apps/nuvs
                      images: ghcr.io/virtool/nuvs
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-tag.outputs.git-tag }}
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
            - name: Set app version from release tag
              run: pnpm -C ${{ matrix.workspace }} version "${{ needs.release-tag.outputs.git-tag }}" --no-git-tag-version
            - name: Login
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract Metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  context: git
                  images: ${{ matrix.images }}
            - name: Build & Push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  target: ${{ matrix.target }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}
                  secrets: |
                      sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
