name: CI

on:
    push:
        branches:
            - "main"
    pull_request:
        branches:
            - "main"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    REGISTRY: ghcr.io

jobs:
    # -------------------------------------------------------------------------
    # Change detection
    # -------------------------------------------------------------------------
    # Image inputs are pnpm workspace dependencies. The leading ellipsis selects
    # every dependent of a workspace changed since the base, so shared package
    # changes automatically select the jobs that consume them.
    #
    # A pull request compares against `main`. A push to `main` compares against
    # the head of the last successful push run, not `github.event.before`: a
    # newer push cancels a pending run, and a failed run must not let the next
    # push skip what it broke. With no usable base, every workspace is selected.
    #
    # Files outside every workspace belong to the root package, which has no
    # dependents. A change to one that every job consumes selects every
    # workspace, so the filtered jobs can't skip a break that lands on `main`.
    changes:
        name: Changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            actions: read
            contents: read
        outputs:
            packages: ${{ steps.affected.outputs.packages }}
            package-tests: ${{ steps.affected.outputs.package-tests }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Setup
              uses: ./.github/actions/setup
            - name: Find base
              id: base
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ "${{ github.event_name }}" = pull_request ]; then
                      git fetch --no-tags origin main
                      base=origin/main
                  else
                      base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml \
                          --branch main --event push --status success --limit 1 \
                          --json headSha --jq '.[0].headSha // empty' || true)
                      if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then
                          base=
                      fi
                  fi
                  echo "base=$base" >> "$GITHUB_OUTPUT"
            # Packages / Test covers every selected workspace with a `test`
            # script except the root and the six that run in dedicated jobs:
            # web, internal, dev-tools and nuvs, and the two persistence
            # packages that share Data & Storage / Test.
            - name: Find affected workspaces
              id: affected
              env:
                  BASE: ${{ steps.base.outputs.base }}
              run: |
                  if [ -z "$BASE" ] || git diff --name-only "$BASE"...HEAD -- \
                      .dockerignore \
                      .github/workflows/ci.yaml \
                      .github/actions \
                      .nvmrc \
                      package.json \
                      pnpm-workspace.yaml \
                      pnpm-lock.yaml \
                      | grep -q .; then
                      filter='*'
                  else
                      filter="...[$BASE]"
                  fi
                  affected="$RUNNER_TEMP/affected.json"
                  pnpm --filter "$filter" list --depth -1 --json > "$affected"
                  packages=$(jq -c '[.[].name]' "$affected")
                  package_tests=$(jq -r --arg root "$PWD" '.[]
                      | select(.path != $root)
                      | select(.name | IN("@virtool/web", "@virtool/data", "@virtool/storage", "@virtool/internal", "@virtool/dev-tools", "@virtool/nuvs") | not)
                      | .path + "/package.json"' "$affected" \
                      | xargs -r jq -s -c '[.[] | select(.scripts.test) | .name]')
                  echo "packages=$packages" >> "$GITHUB_OUTPUT"
                  echo "package-tests=${package_tests:-[]}" >> "$GITHUB_OUTPUT"

    # -------------------------------------------------------------------------
    # Checks (repo-wide)
    # -------------------------------------------------------------------------
    checks:
        name: Checks
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Biome
              run: pnpm check
            - name: Knip
              run: pnpm knip
            - name: Typescript
              run: pnpm typecheck
            - name: Drizzle schema
              run: |
                  pnpm --filter @virtool/data db:generate
                  if [[ -n "$(git status --porcelain --untracked-files=all -- packages/data/drizzle)" ]]; then
                      git status --short --untracked-files=all -- packages/data/drizzle
                      exit 1
                  fi

    # -------------------------------------------------------------------------
    # Docs prose (*.md, *.mdx)
    # -------------------------------------------------------------------------
    # Vale lints Markdown and MDX against the Google and write-good styles named
    # in `.vale.ini`. `MinAlertLevel = warning` prints warnings but only
    # error-level alerts set a non-zero exit, so this gate fails on errors and
    # leaves warnings advisory. No checkout of the styles: they are gitignored
    # and `vale sync` fetches them from pinned package release URLs. No `Setup`
    # action either — this job runs no pnpm, and skipping node_modules keeps `vale .`
    # off the dependency tree it would otherwise walk.
    docs-lint:
        name: Docs / Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # Pinned to the version the vocabulary and style overrides were
            # cleared against; a floating install could add rules that fail a
            # branch nothing changed.
            - name: Install Vale
              uses: jdx/mise-action@v5
              with:
                  install_args: vale
            - name: Sync styles
              run: vale sync
            - name: Lint
              run: vale --glob='*.{md,mdx}' .

    # -------------------------------------------------------------------------
    # Docker images (apps/web, apps/internal, apps/create-subtraction,
    # apps/pathoscope)
    # -------------------------------------------------------------------------
    build:
        name: ${{ matrix.area }} / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        needs: [changes]
        strategy:
            fail-fast: false
            # Adding an app needs an app Dockerfile, a Bake target, and an entry here;
            # everything else about a new app is generic. Keep this list and the
            # one in release-ghcr in step.
            matrix:
                include:
                    - image: web
                      target: dist
                      package: "@virtool/web"
                      workspace: apps/web
                      area: Web
                    - image: internal
                      target: internal
                      package: "@virtool/internal"
                      workspace: apps/internal
                      area: Internal
                    - image: create-sample
                      target: create-sample
                      package: "@virtool/create-sample"
                      workspace: apps/create-sample
                      area: Create Sample
                    - image: create-subtraction
                      target: create-subtraction
                      package: "@virtool/create-subtraction"
                      workspace: apps/create-subtraction
                      area: Create Subtraction
        steps:
            - name: Checkout
              if: contains(fromJSON(needs.changes.outputs.packages), matrix.package)
              uses: actions/checkout@v7
            - name: Setup
              if: contains(fromJSON(needs.changes.outputs.packages), matrix.package)
              uses: ./.github/actions/setup
            - name: Prepare image context
              if: contains(fromJSON(needs.changes.outputs.packages), matrix.package)
              run: |
                  pnpm --filter ${{ matrix.package }} build
                  # The web image runs its self-contained `.output` bundle from
                  # the app directory, so it needs no deployed dependencies.
                  if [ "${{ matrix.image }}" != web ]; then
                      pnpm --filter ${{ matrix.package }} --prod deploy .docker-build/${{ matrix.image }} --force
                  fi
            # The default `docker` driver cannot export a build cache, so the
            # gha cache below needs a docker-container builder.
            - name: Setup Buildx
              if: contains(fromJSON(needs.changes.outputs.packages), matrix.package)
              uses: docker/setup-buildx-action@v4
            # `source: .` builds from the working directory, because the image
            # context is made on the runner and is not in Git. Pull requests
            # read the cache but don't write it. A pull request's cache is
            # visible only to that pull request, and those writes push the main
            # branch's layers out of the cache.
            - name: Build
              if: contains(fromJSON(needs.changes.outputs.packages), matrix.package)
              uses: docker/bake-action@v7
              with:
                  source: .
                  files: packages/image-build/docker-bake.hcl
                  targets: ${{ matrix.image }}
                  set: |
                      ${{ matrix.image }}.cache-from=type=gha,scope=${{ matrix.image }}
                      ${{ github.event_name == 'push' && format('{0}.cache-to=type=gha,mode=max,scope={0}', matrix.image) || '' }}

    # -------------------------------------------------------------------------
    # Web (apps/web)
    # -------------------------------------------------------------------------
    web-test:
        name: Web / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/web')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project web
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    web-test-server:
        name: Web / Test Server
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/web')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project server
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    web-test-a11y:
        name: Web / Accessibility
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/web')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Keyed on the Playwright version rather than the lockfile hash:
            # the browser revision a release pins is this cache's only input, so
            # an unrelated dependency bump must not throw the download away. No
            # `restore-keys` either — a near-miss restore would seed the
            # directory with a revision `install` then downloads past, leaving
            # both in the cache.
            - name: Resolve Playwright version
              id: playwright
              run: echo "version=$(pnpm --filter @virtool/web exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
            # No `--with-deps`. It shells out to `apt-get update && apt-get
            # install`, which carries no timeout of its own: when the runner's
            # Azure mirror goes unreachable apt falls back to
            # archive.ubuntu.com and stalls until the job timeout kills it. The
            # ubuntu-24.04 image ships Chrome and Edge, so Chromium's shared
            # libraries are already present. The step timeout below is a
            # backstop for a slow CDN, not for apt.
            - name: Install Playwright Chromium
              run: pnpm --filter @virtool/web exec playwright install chromium
              timeout-minutes: 5
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project a11y
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Internal (apps/internal, apps/dev-tools)
    # -------------------------------------------------------------------------
    internal-test:
        name: Internal / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/internal') || contains(fromJSON(needs.changes.outputs.packages), '@virtool/dev-tools')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Its own job rather than part of Packages / Test, for the same
            # reason as Data & Storage / Test: the job guard and the task probes are tested
            # against a real Postgres testcontainer, and pulling that image does
            # not belong in the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/internal --filter @virtool/dev-tools test
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Nuvs (apps/nuvs)
    # -------------------------------------------------------------------------
    # Also published by `release-ghcr` as `ghcr.io/virtool/nuvs`.
    #
    # The 45-minute timeout is longer than pathoscope's 30: this image compiles
    # SPAdes from source, which is the single most expensive thing either
    # workflow build does. It is the first stage in the Dockerfile and depends on
    # nothing else, so a warm layer cache skips it entirely.
    nuvs-build:
        name: Nuvs / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/nuvs')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Prepare image context
              run: |
                  pnpm --filter @virtool/nuvs build
                  pnpm --filter @virtool/nuvs --prod deploy .docker-build/nuvs --force
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v4
            # `source: .` builds from the working directory, because the image
            # context is made on the runner and is not in Git. Pull requests
            # read the cache but don't write it. A pull request's cache is
            # visible only to that pull request, and those writes push the main
            # branch's layers out of the cache.
            - name: Build
              uses: docker/bake-action@v7
              with:
                  source: .
                  files: packages/image-build/docker-bake.hcl
                  targets: nuvs
                  set: |
                      nuvs.cache-from=type=gha,scope=nuvs
                      ${{ github.event_name == 'push' && 'nuvs.cache-to=type=gha,mode=max,scope=nuvs' || '' }}

    nuvs-test:
        name: NuVs / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/nuvs')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              run: pnpm --filter @virtool/nuvs test
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Pathoscope (apps/pathoscope, packages/pathoscope-core)
    # -------------------------------------------------------------------------
    # Also published by `release-ghcr` as `ghcr.io/virtool/pathoscope`.
    pathoscope-build:
        name: Pathoscope / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/pathoscope')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Prepare image context
              run: |
                  pnpm --filter @virtool/pathoscope build
                  pnpm --filter @virtool/pathoscope --prod deploy .docker-build/pathoscope --force
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v4
            # `source: .` builds from the working directory, because the image
            # context is made on the runner and is not in Git. Pull requests
            # read the cache but don't write it. A pull request's cache is
            # visible only to that pull request, and those writes push the main
            # branch's layers out of the cache.
            - name: Build
              uses: docker/bake-action@v7
              with:
                  source: .
                  files: packages/image-build/docker-bake.hcl
                  targets: pathoscope
                  set: |
                      pathoscope.cache-from=type=gha,scope=pathoscope
                      ${{ github.event_name == 'push' && 'pathoscope.cache-to=type=gha,mode=max,scope=pathoscope' || '' }}

    pathoscope-test:
        name: Pathoscope / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/pathoscope-core') || contains(fromJSON(needs.changes.outputs.packages), '@virtool/workflow-tools')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # Format and test run inside the workflow-tools Dockerfile, against
            # the same Rust toolchain, libclang, and bowtie2 build the image
            # ships. That stage sets VT_REQUIRE_BOWTIE2, so the `candidates`
            # golden vectors can never be skipped silently.
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v4
            # Pull requests read the cache but don't write it. A pull request's
            # cache is visible only to that pull request, and those writes push
            # the main branch's layers out of the cache.
            - name: Test
              uses: docker/bake-action@v7
              with:
                  source: .
                  files: packages/image-build/docker-bake.hcl
                  targets: pathoscope-core-test
                  set: |
                      pathoscope-core-test.cache-from=type=gha,scope=pathoscope-core-test
                      ${{ github.event_name == 'push' && 'pathoscope-core-test.cache-to=type=gha,mode=max,scope=pathoscope-core-test' || '' }}

    # -------------------------------------------------------------------------
    # Quality (packages/quality-core)
    # -------------------------------------------------------------------------
    # Plain cargo on the runner, unlike pathoscope-test: this crate links
    # nothing native, and its goldens are FastQC output checked in rather than
    # something a tool has to be built to produce.
    quality-test:
        name: Quality / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/quality-core')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Cache cargo
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      packages/quality-core/target
                  key: cargo-quality-${{ runner.os }}-${{ hashFiles('packages/quality-core/Cargo.lock') }}
                  restore-keys: cargo-quality-${{ runner.os }}-
            - name: Format
              run: cargo fmt --check
              working-directory: packages/quality-core
            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings
              working-directory: packages/quality-core
            - name: Test
              run: cargo test
              working-directory: packages/quality-core

    # -------------------------------------------------------------------------
    # Site (apps/site)
    # -------------------------------------------------------------------------
    site-build:
        name: Site / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/site')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Build site
              run: pnpm --filter @virtool/site build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # -------------------------------------------------------------------------
    # Packages (packages/*, excluding Data and Storage below)
    # -------------------------------------------------------------------------
    packages-test:
        name: Packages / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        needs: [changes]
        if: needs.changes.outputs.package-tests != '[]'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              env:
                  PACKAGES: ${{ needs.changes.outputs.package-tests }}
              run: pnpm -r $(jq -r '.[] | "--filter=" + .' <<< "$PACKAGES") test

    # -------------------------------------------------------------------------
    # Data and Storage (packages/data, packages/storage)
    # -------------------------------------------------------------------------
    data-storage-test:
        name: Data & Storage / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: [changes]
        if: contains(fromJSON(needs.changes.outputs.packages), '@virtool/data') || contains(fromJSON(needs.changes.outputs.packages), '@virtool/storage')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Its own job rather than part of Packages / Test: data starts a
            # Postgres testcontainer and storage starts Garage and Azurite,
            # and pulling those images does not belong in the fast package
            # loop. The two persistence packages share one job, run with
            # --parallel so their testcontainer pulls overlap despite the
            # data-on-storage dependency, and neither fills the job's
            # wall-clock budget.
            - name: Test
              run: pnpm --parallel --filter @virtool/data --filter @virtool/storage test
              env:
                  TZ: UTC


    # -------------------------------------------------------------------------
    # Release
    # -------------------------------------------------------------------------
    # On push to main, the release jobs do two things:
    #
    # - If change files exist, `release` runs Knope to prepare a release on
    #   branch `knope/release` and opens or updates the "Release" pull request.
    # - If a Knope package has a version with no tag, `release-ghcr` pushes its
    #   images and `release-github` then makes the tags and GitHub Releases.
    #
    # The merge of the release pull request removes the change files and adds
    # the new versions, so its push goes to the second path. Both paths can run
    # on one push. This occurs when a different merge cancels the pending run
    # of the release merge.
    release:
        name: Release
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs:
            [
                build,
                changes,
                checks,
                data-storage-test,
                docs-lint,
                internal-test,
                nuvs-build,
                nuvs-test,
                packages-test,
                pathoscope-build,
                pathoscope-test,
                quality-test,
                site-build,
                web-test,
                web-test-a11y,
                web-test-server,
            ]
        # A filtered job skips when a push does not affect it. Release runs
        # after skipped jobs, but not after a failed or cancelled job. `changes`
        # is in `needs` because its failure skips every filtered job.
        if: >-
            github.event_name == 'push' && github.repository_owner == 'Virtool'
            && !cancelled()
            && !contains(needs.*.result, 'failure')
            && !contains(needs.*.result, 'cancelled')
        env:
            MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        steps:
            # Workflows do not start for a push or pull request made with
            # `GITHUB_TOKEN`. The release pull request needs CI, so the
            # `virtool-releaser` GitHub App pushes and opens it.
            - name: Token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASER_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
            # Knope finds the pull request of each change file in the history.
            # The App token stays out of `.git/config`, so dependency install
            # scripts can't read it. Only the push uses it.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Find change files
              id: pending
              run: |
                  if compgen -G '.changeset/*.md' > /dev/null; then
                      echo "found=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "found=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: Setup
              if: steps.pending.outputs.found == 'true'
              uses: ./.github/actions/setup
            - name: Install Knope
              if: steps.pending.outputs.found == 'true'
              uses: jdx/mise-action@v5
              with:
                  install_args: github:knope-dev/knope
            - name: Prepare release
              if: steps.pending.outputs.found == 'true'
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
              run: |
                  git switch -C knope/release
                  knope prepare-release --verbose
                  if git diff --cached --quiet; then
                      exit 0
                  fi

                  # Knope writes package.json with spaces and no final newline.
                  mapfile -t manifests < <(git diff --cached --name-only --diff-filter=AM -- '*package.json')
                  if [ "${#manifests[@]}" -gt 0 ]; then
                      pnpm exec biome format --write "${manifests[@]}"
                      git add -- "${manifests[@]}"
                  fi

                  body="$RUNNER_TEMP/release-body.md"
                  echo "Merge this pull request to publish the images and GitHub Releases below." > "$body"
                  for changelog in $(git diff --cached --name-only -- CHANGELOG.md 'apps/*/CHANGELOG.md'); do
                      if [ "$changelog" = CHANGELOG.md ]; then
                          name=virtool
                      else
                          name=$(basename "$(dirname "$changelog")")
                      fi
                      {
                          printf '\n## %s\n\n' "$name"
                          git diff --cached --no-color --unified=0 -- "$changelog" \
                              | awk '/^@@/ { h = 1; next } h && /^\+/ { print substr($0, 2) }' \
                              | sed 's/^#/##/'
                      } >> "$body"
                  done

                  user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
                  git config user.name "${APP_SLUG}[bot]"
                  git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
                  git commit -m "Release"

                  # A run that started before a newer push, such as the merge
                  # of the release pull request, has stale change files. The
                  # run for the newer push prepares the release.
                  if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
                      echo "main moved past ${GITHUB_SHA}; skipping release preparation"
                      exit 0
                  fi

                  git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" knope/release

                  number=$(gh pr list --head knope/release --base main --state open --json number --jq '.[0].number // empty')
                  if [ -n "$number" ]; then
                      gh pr edit "$number" --title "Release" --body-file "$body"
                  else
                      gh pr create --head knope/release --base main --title "Release" --body-file "$body"
                  fi
    release-ghcr-matrix:
        name: Release / Matrix
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs: [release]
        outputs:
            include: ${{ steps.matrix.outputs.include }}
            any: ${{ steps.matrix.outputs.any }}
            releases: ${{ steps.matrix.outputs.releases }}
        steps:
            # The full history finds the commit that set each version.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            # A Knope package is released when its version has no tag. The
            # `virtool` tag is the plain version, which continues the earlier
            # semantic-release tags. Other tags are `<name>@<version>`. Each
            # package gives its images. Keep this map in step with `knope.toml`
            # and the `build` matrix.
            #
            # Each image is built from the commit that last changed the
            # package's version, not the pushed commit. A later push that finds
            # the version still untagged, such as after a failed run, then
            # publishes what was released and not what came after it.
            - name: Build matrix
              id: matrix
              run: |
                  set -o pipefail
                  packages='[
                    {"name": "virtool", "file": "apps/web/package.json", "changelog": "CHANGELOG.md", "images": [
                      {"image": "web", "package": "@virtool/web"},
                      {"image": "internal", "package": "@virtool/internal"}]},
                    {"name": "create-sample", "file": "apps/create-sample/package.json", "changelog": "apps/create-sample/CHANGELOG.md", "images": [
                      {"image": "create-sample", "package": "@virtool/create-sample"}]},
                    {"name": "create-subtraction", "file": "apps/create-subtraction/package.json", "changelog": "apps/create-subtraction/CHANGELOG.md", "images": [
                      {"image": "create-subtraction", "package": "@virtool/create-subtraction"}]},
                    {"name": "pathoscope", "file": "apps/pathoscope/package.json", "changelog": "apps/pathoscope/CHANGELOG.md", "images": [
                      {"image": "pathoscope", "package": "@virtool/pathoscope"}]},
                    {"name": "nuvs", "file": "apps/nuvs/package.json", "changelog": "apps/nuvs/CHANGELOG.md", "images": [
                      {"image": "nuvs", "package": "@virtool/nuvs"}]}
                  ]'
                  tags=$(git ls-remote --tags --refs origin | cut -f2)
                  include='[]'
                  releases='[]'
                  while read -r package; do
                      name=$(jq -r .name <<< "$package")
                      file=$(jq -r .file <<< "$package")
                      version=$(jq -r .version "$file")
                      if [ "$name" = virtool ]; then
                          tag=$version
                      else
                          tag="${name}@${version}"
                      fi
                      if grep -qxF "refs/tags/${tag}" <<< "$tags"; then
                          continue
                      fi
                      ref=$(git log -1 --first-parent --format=%H -G'^[[:space:]]*"version":' -- "$file")
                      if [ -z "$ref" ]; then
                          echo "::error::No commit sets the version in ${file}."
                          exit 1
                      fi
                      echo "Release ${tag} from ${ref}"
                      include=$(jq -c --argjson p "$package" --arg version "$version" --arg ref "$ref" --arg registry "$REGISTRY" \
                          '. + [$p.images[] | . + {version: $version, ref: $ref, images: ($registry + "/virtool/" + .image)}]' \
                          <<< "$include")
                      releases=$(jq -c --argjson p "$package" --arg version "$version" --arg tag "$tag" --arg ref "$ref" \
                          '. + [{name: $p.name, version: $version, tag: $tag, ref: $ref, changelog: $p.changelog}]' \
                          <<< "$releases")
                  done < <(jq -c '.[]' <<< "$packages")
                  echo "include=$include" >> "$GITHUB_OUTPUT"
                  echo "releases=$releases" >> "$GITHUB_OUTPUT"
                  if [ "$(jq 'length' <<< "$include")" -gt 0 ]; then
                      echo "any=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "any=false" >> "$GITHUB_OUTPUT"
                  fi
    release-ghcr:
        # No `${{ matrix.image }}` in the name. GitHub skips this job on each
        # pull request before it expands the matrix, so the checks list would
        # show the expression and not an image name.
        name: Release / GHCR
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        needs: [release-ghcr-matrix]
        if: needs.release-ghcr-matrix.outputs.any == 'true'
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            # The pathoscope and nuvs legs read the gha cache that
            # pathoscope-build and nuvs-build write. Thus this job does not
            # build the Rust crate, the bioinformatics tools, and SPAdes again
            # in its 20-minute timeout.
            matrix:
                include: ${{ fromJSON(needs.release-ghcr-matrix.outputs.include) }}
        steps:
            # `release-github` makes the tags at the same commit.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ matrix.ref }}
            - name: Setup
              uses: ./.github/actions/setup
            - name: Prepare image context
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              run: |
                  pnpm --filter ${{ matrix.package }} build
                  # The web image runs its self-contained `.output` bundle from
                  # the app directory, so it needs no deployed dependencies.
                  if [ "${{ matrix.image }}" != web ]; then
                      pnpm --filter ${{ matrix.package }} --prod deploy .docker-build/${{ matrix.image }} --force
                  fi
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # `source: .` builds from the working directory, because the image
            # context is made on the runner and is not in Git.
            - name: Build & Push
              uses: docker/bake-action@v7
              with:
                  source: .
                  files: packages/image-build/docker-bake.hcl
                  targets: ${{ matrix.image }}
                  push: true
                  set: |
                      ${{ matrix.image }}.tags=${{ matrix.images }}:${{ matrix.version }}
                      ${{ matrix.image }}.tags+=${{ matrix.images }}:latest
                      ${{ matrix.image }}.cache-from=type=gha,scope=${{ matrix.image }}
                      ${{ matrix.image }}.cache-to=type=gha,mode=max,scope=${{ matrix.image }}
    # Runs only after all images are pushed, so a GitHub Release always has its
    # images. Each Release targets the commit its images were built from. A
    # failed image leg skips this job; re-run the failed legs, not a new push.
    release-github:
        name: Release / GitHub
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        needs: [release-ghcr-matrix, release-ghcr]
        if: needs.release-ghcr-matrix.outputs.any == 'true'
        steps:
            - name: Token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASER_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
                  permission-contents: write
            # The full history holds each package's ref and its changelog.
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Release
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  RELEASES: ${{ needs.release-ghcr-matrix.outputs.releases }}
              run: node scripts/create-releases.mjs
