name: CI

on:
    push:
        branches:
            - "main"
    pull_request:
        branches:
            - "main"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    REGISTRY: ghcr.io
    NODE_VERSION: 22
    PNPM_VERSION: 11.1.3

jobs:
    build:
        name: Build
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # The default `docker` driver cannot export a build cache, so the
            # gha cache below needs a docker-container builder.
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build and Push
              uses: docker/build-push-action@v7
              with:
                  target: dist
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
    build-pathoscope:
        name: Build / Pathoscope
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: apps/workflow-pathoscope/Dockerfile
                  cache-from: type=gha,scope=pathoscope
                  cache-to: type=gha,mode=max,scope=pathoscope
    test-rust:
        name: Test / Rust
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # hts-sys runs bindgen against htslib's headers and does not fall
            # back to pre-generated bindings, so libclang is required here just
            # as it is in the image build.
            - name: Install libclang
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
            # The `candidates` golden vectors shell out to bowtie2. Without it
            # the harness skips them; VT_REQUIRE_BOWTIE2 below turns that skip
            # into a failure so CI can never quietly stop checking them.
            - name: Install bowtie2
              run: |
                  container=$(docker create ghcr.io/virtool/tools:1.2.0)
                  sudo docker cp "$container:/tools/bowtie2/2.5.4/." /usr/local/bin/
                  docker rm "$container"
                  bowtie2 --version | head -1
            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      packages/pathoscope-core/target
                  key: cargo-${{ runner.os }}-${{ hashFiles('packages/pathoscope-core/Cargo.lock') }}
                  restore-keys: cargo-${{ runner.os }}-
            - name: Format
              run: cargo fmt --check
              working-directory: packages/pathoscope-core
            - name: Test
              run: cargo test
              working-directory: packages/pathoscope-core
              env:
                  VT_REQUIRE_BOWTIE2: "1"
    check-biome:
        name: Biome
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Run Biome
              run: pnpm check
    check-knip:
        name: Knip
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Run Knip
              run: pnpm knip
    check-typescript:
        name: Typescript
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: tsc
              run: pnpm typecheck
    test-packages:
        name: Test / Packages
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Test
              run: pnpm --filter @virtool/bio --filter @virtool/contracts --filter @virtool/logger --filter @virtool/site test
    test-data:
        name: Test / Data
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            # Its own job rather than part of Test / Packages, for the same
            # reason as Test / Storage: it starts a Postgres testcontainer, and
            # pulling that image does not belong in the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/data test
              env:
                  TZ: UTC
    test-storage:
        name: Test / Storage
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            # Its own job rather than part of Test / Packages: the integration
            # project starts Garage and Azurite in testcontainers, and pulling
            # those images does not belong in the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/storage test
    test-web:
        name: Test / Web
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project web
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    test-server:
        name: Test / Server
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project server
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    test-a11y:
        name: Test / Accessibility
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Install Playwright Chromium
              run: pnpm --filter @virtool/web exec playwright install --with-deps chromium
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project a11y
              env:
                  TZ: UTC
    build-site:
        name: Build Site
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Build site
              run: pnpm --filter @virtool/site build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    release:
        name: Publish / Release
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs:
            [
                build,
                build-pathoscope,
                build-site,
                check-biome,
                check-knip,
                check-typescript,
                test-packages,
                test-data,
                test-rust,
                test-storage,
                test-web,
                test-server,
                test-a11y,
            ]
        if: github.event_name == 'push'
        outputs:
            git-tag: ${{ steps.semantic.outputs.git-tag }}
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}
            - name: Run semantic-release
              id: semantic
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm exec semantic-release
    publish-ghcr:
        name: Publish / GHCR
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        if: github.repository_owner == 'Virtool' && github.event_name == 'push' && needs.release.outputs.git-tag != ''
        needs: [release]
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release.outputs.git-tag }}
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}
            - name: Set web app version from release tag
              run: pnpm -C apps/web version "${{ needs.release.outputs.git-tag }}" --no-git-tag-version
            - name: Login
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract Metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  context: git
                  images: ${{ env.REGISTRY }}/virtool/ui
            - name: Build & Push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  target: dist
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  secrets: |
                      sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
    publish-pathoscope:
        name: Publish / Pathoscope
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        if: github.repository_owner == 'Virtool' && github.event_name == 'push' && needs.release.outputs.git-tag != ''
        needs: [release]
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release.outputs.git-tag }}
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract Metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  context: git
                  images: ${{ env.REGISTRY }}/virtool/ts-pathoscope
            - name: Build & Push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: apps/workflow-pathoscope/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=pathoscope
                  cache-to: type=gha,mode=max,scope=pathoscope
