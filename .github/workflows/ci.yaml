name: CI

on:
    push:
        branches:
            - "main"
    pull_request:
        branches:
            - "main"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    REGISTRY: ghcr.io

jobs:
    # -------------------------------------------------------------------------
    # Change detection
    # -------------------------------------------------------------------------
    # Image inputs are pnpm workspace dependencies. The leading ellipsis selects
    # every dependent of a workspace changed since the PR base, so shared
    # package changes automatically select the images that consume them.
    changes:
        name: Changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            packages: ${{ steps.affected.outputs.packages }}
        steps:
            - name: Checkout
              if: github.event_name == 'pull_request'
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Setup
              if: github.event_name == 'pull_request'
              uses: ./.github/actions/setup
            - name: Find affected workspaces
              id: affected
              if: github.event_name == 'pull_request'
              run: |
                  git fetch --no-tags origin main
                  packages=$(pnpm --filter '...[origin/main]' list --depth -1 --json | jq -c '[.[].name]')
                  echo "packages=$packages" >> "$GITHUB_OUTPUT"

    # -------------------------------------------------------------------------
    # Checks (repo-wide)
    # -------------------------------------------------------------------------
    checks:
        name: Checks
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Biome
              run: pnpm check
            - name: Knip
              run: pnpm knip
            - name: Typescript
              run: pnpm typecheck
            - name: Drizzle schema
              run: |
                  pnpm --filter @virtool/data db:generate
                  if [[ -n "$(git status --porcelain --untracked-files=all -- packages/data/drizzle)" ]]; then
                      git status --short --untracked-files=all -- packages/data/drizzle
                      exit 1
                  fi

    # -------------------------------------------------------------------------
    # Docs prose (*.md, *.mdx)
    # -------------------------------------------------------------------------
    # Vale lints Markdown and MDX against the Google and write-good styles named
    # in `.vale.ini`. `MinAlertLevel = warning` prints warnings but only
    # error-level alerts set a non-zero exit, so this gate fails on errors and
    # leaves warnings advisory. No checkout of the styles: they are gitignored
    # and `vale sync` fetches them from pinned package release URLs. No `Setup`
    # action either — this job runs no pnpm, and skipping node_modules keeps `vale .`
    # off the dependency tree it would otherwise walk.
    docs-lint:
        name: Docs / Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # Pinned to the version the vocabulary and style overrides were
            # cleared against; a floating install could add rules that fail a
            # branch nothing changed.
            - name: Install Vale
              run: |
                  curl -sfL https://github.com/errata-ai/vale/releases/download/v3.18.0/vale_3.18.0_Linux_64-bit.tar.gz \
                      | sudo tar -xz -C /usr/local/bin vale
                  vale --version
            - name: Sync styles
              run: vale sync
            - name: Lint
              run: vale --glob='*.{md,mdx}' .

    # -------------------------------------------------------------------------
    # Docker images (apps/web, apps/internal, apps/create-subtraction,
    # apps/pathoscope)
    # -------------------------------------------------------------------------
    build:
        name: ${{ matrix.area }} / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        needs: [changes]
        strategy:
            fail-fast: false
            # Adding an app needs an app Dockerfile, a Bake target, and an entry here;
            # everything else about a new app is generic. Keep this list and the
            # one in release-ghcr in step.
            matrix:
                include:
                    - image: web
                      target: dist
                      package: "@virtool/web"
                      workspace: apps/web
                      area: Web
                    - image: internal
                      target: internal
                      package: "@virtool/internal"
                      workspace: apps/internal
                      area: Internal
                    - image: create-sample
                      target: create-sample
                      package: "@virtool/create-sample"
                      workspace: apps/create-sample
                      area: Create Sample
                    - image: create-subtraction
                      target: create-subtraction
                      package: "@virtool/create-subtraction"
                      workspace: apps/create-subtraction
                      area: Create Subtraction
        steps:
            - name: Checkout
              if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.packages), matrix.package)
              uses: actions/checkout@v7
            - name: Setup
              if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.packages), matrix.package)
              uses: ./.github/actions/setup
            - name: Prepare image context
              if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.packages), matrix.package)
              run: |
                  pnpm --filter ${{ matrix.package }} build
                  pnpm --filter ${{ matrix.package }} --prod deploy .docker-build/${{ matrix.image }} --force
            # The default `docker` driver cannot export a build cache, so the
            # gha cache below needs a docker-container builder.
            - name: Setup Buildx
              if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.packages), matrix.package)
              uses: docker/setup-buildx-action@v4
            - name: Build
              if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.packages), matrix.package)
              run: |
                  docker buildx bake -f packages/image-build/docker-bake.hcl ${{ matrix.image }} \
                      --set '${{ matrix.image }}.cache-from=type=gha,scope=${{ matrix.image }}' \
                      --set '${{ matrix.image }}.cache-to=type=gha,mode=max,scope=${{ matrix.image }}'
    # Also published by `release-ghcr` as `ghcr.io/virtool/pathoscope`.
    build-pathoscope:
        name: Pathoscope / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        needs: [changes]
        # Unconditional on `push`, deliberately. `release` lists this job in
        # `needs`, and running it on every push to main keeps that gate complete
        # without the skipped-dependency handling
        # (`if: always() && !contains(needs.*.result, 'failure')`) a filtered
        # dependency would otherwise force onto it. PRs get the savings.
        if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.packages), '@virtool/pathoscope')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Prepare image context
              run: |
                  pnpm --filter @virtool/pathoscope build
                  pnpm --filter @virtool/pathoscope --prod deploy .docker-build/pathoscope --force
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build
              run: |
                  docker buildx bake -f packages/image-build/docker-bake.hcl pathoscope \
                      --set 'pathoscope.cache-from=type=gha,scope=pathoscope' \
                      --set 'pathoscope.cache-to=type=gha,mode=max,scope=pathoscope'

    # -------------------------------------------------------------------------
    # Web (apps/web)
    # -------------------------------------------------------------------------
    web-test:
        name: Web / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project web
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    web-test-server:
        name: Web / Test Server
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project server
              env:
                  TZ: UTC
                  VT_TEST_REACT_COMPILER: "1"
    web-test-a11y:
        name: Web / Accessibility
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Keyed on the Playwright version rather than the lockfile hash:
            # the browser revision a release pins is this cache's only input, so
            # an unrelated dependency bump must not throw the download away. No
            # `restore-keys` either — a near-miss restore would seed the
            # directory with a revision `install` then downloads past, leaving
            # both in the cache.
            - name: Resolve Playwright version
              id: playwright
              run: echo "version=$(pnpm --filter @virtool/web exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
            # No `--with-deps`. It shells out to `apt-get update && apt-get
            # install`, which carries no timeout of its own: when the runner's
            # Azure mirror goes unreachable apt falls back to
            # archive.ubuntu.com and stalls until the job timeout kills it. The
            # ubuntu-24.04 image ships Chrome and Edge, so Chromium's shared
            # libraries are already present. The step timeout below is a
            # backstop for a slow CDN, not for apt.
            - name: Install Playwright Chromium
              run: pnpm --filter @virtool/web exec playwright install chromium
              timeout-minutes: 5
            - name: Test
              run: VT_TEST_WORKERS=$(nproc) pnpm --filter @virtool/web exec vitest run --project a11y
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Internal (apps/internal, apps/dev-tools)
    # -------------------------------------------------------------------------
    internal-test:
        name: Internal / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Its own job rather than part of Packages / Test, for the same
            # reason as Data & Storage / Test: the job guard and the task probes are tested
            # against a real Postgres testcontainer, and pulling that image does
            # not belong in the fast package loop.
            - name: Test
              run: pnpm --filter @virtool/internal --filter @virtool/dev-tools test
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Nuvs (apps/nuvs)
    # -------------------------------------------------------------------------
    # Also published by `release-ghcr` as `ghcr.io/virtool/nuvs`.
    #
    # The 45-minute timeout is longer than pathoscope's 30: this image compiles
    # SPAdes from source, which is the single most expensive thing either
    # workflow build does. It is the first stage in the Dockerfile and depends on
    # nothing else, so a warm layer cache skips it entirely.
    build-nuvs:
        name: Nuvs / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        needs: [changes]
        # Unconditional on `push`, deliberately. `release` lists this job in
        # `needs`, and running it on every push to main keeps that gate complete
        # without the skipped-dependency handling
        # (`if: always() && !contains(needs.*.result, 'failure')`) a filtered
        # dependency would otherwise force onto it. PRs get the savings.
        if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.packages), '@virtool/nuvs')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Prepare image context
              run: |
                  pnpm --filter @virtool/nuvs build
                  pnpm --filter @virtool/nuvs --prod deploy .docker-build/nuvs --force
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build
              run: |
                  docker buildx bake -f packages/image-build/docker-bake.hcl nuvs \
                      --set 'nuvs.cache-from=type=gha,scope=nuvs' \
                      --set 'nuvs.cache-to=type=gha,mode=max,scope=nuvs'

    nuvs-test:
        name: NuVs / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        needs: [changes]
        if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.packages), '@virtool/nuvs')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Test
              run: pnpm --filter @virtool/nuvs test
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Pathoscope (apps/pathoscope, packages/pathoscope-core)
    # -------------------------------------------------------------------------
    pathoscope-test:
        name: Pathoscope / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        needs: [changes]
        # See the note on `build-pathoscope`: filtered on pull requests,
        # unconditional on `push` so the `release` gate stays complete.
        if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.packages), '@virtool/pathoscope-core') || contains(fromJSON(needs.changes.outputs.packages), '@virtool/workflow-tools')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            # hts-sys runs bindgen against htslib's headers and does not fall
            # back to pre-generated bindings, so libclang is required here just
            # as it is in the image build. Unlike the accessibility job's
            # Playwright libraries it cannot simply be dropped, so apt is
            # bounded instead. The runner's mirrorlist puts
            # azure.archive.ubuntu.com first; when that host goes unreachable
            # apt retries it for every index against a two-minute default
            # timeout before falling back to archive.ubuntu.com, which reads as
            # a hang. Rewriting the mirrorlist skips the dead host outright and
            # the acquire options cap what a merely slow one can cost, for the
            # package downloads as well as the index fetch. The step timeout is
            # the backstop for both.
            - name: Install libclang
              timeout-minutes: 5
              run: |
                  if [ -f /etc/apt/apt-mirrors.txt ]; then
                      sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
                  fi
                  printf 'Acquire::Retries "2";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
                      | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libclang-dev
            # The `candidates` golden vectors shell out to bowtie2. Without it
            # the harness skips them; VT_REQUIRE_BOWTIE2 below turns that skip
            # into a failure so CI can never quietly stop checking them. It is
            # built from the shared workflow-tools Dockerfile rather than apt, so
            # this job and the workflow images always run the same bowtie2
            # build.
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v4
            - name: Build bowtie2
              run: |
                  docker buildx bake -f packages/image-build/docker-bake.hcl bowtie2 \
                      --set 'bowtie2.output=type=local,dest=/tmp/bowtie2' \
                      --set 'bowtie2.cache-from=type=gha,scope=bowtie2' \
                      --set 'bowtie2.cache-to=type=gha,mode=max,scope=bowtie2'
            - name: Install bowtie2
              run: |
                  sudo cp /tmp/bowtie2/tools/bowtie2/2.5.4/* /usr/local/bin/
                  bowtie2 --version | head -1
            - name: Cache cargo
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      packages/pathoscope-core/target
                  key: cargo-${{ runner.os }}-${{ hashFiles('packages/pathoscope-core/Cargo.lock') }}
                  restore-keys: cargo-${{ runner.os }}-
            - name: Format
              run: cargo fmt --check
              working-directory: packages/pathoscope-core
            - name: Test
              run: cargo test
              working-directory: packages/pathoscope-core
              env:
                  VT_REQUIRE_BOWTIE2: "1"

    # -------------------------------------------------------------------------
    # Quality (packages/quality-core)
    # -------------------------------------------------------------------------
    # Much cheaper than pathoscope-test, and deliberately so: this crate links
    # nothing native, so there is no libclang install, and its goldens are
    # FastQC output checked in rather than something a tool has to be built to
    # produce. Just cargo.
    quality-test:
        name: Quality / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: [changes]
        # See the note on `build-pathoscope`: filtered on pull requests,
        # unconditional on `push` so the `release` gate stays complete.
        if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.packages), '@virtool/quality-core')
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Cache cargo
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      packages/quality-core/target
                  key: cargo-quality-${{ runner.os }}-${{ hashFiles('packages/quality-core/Cargo.lock') }}
                  restore-keys: cargo-quality-${{ runner.os }}-
            - name: Format
              run: cargo fmt --check
              working-directory: packages/quality-core
            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings
              working-directory: packages/quality-core
            - name: Test
              run: cargo test
              working-directory: packages/quality-core

    # -------------------------------------------------------------------------
    # Site (apps/site)
    # -------------------------------------------------------------------------
    site-build:
        name: Site / Build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            - name: Build site
              run: pnpm --filter @virtool/site build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # -------------------------------------------------------------------------
    # Packages (packages/*, excluding Data and Storage below)
    # -------------------------------------------------------------------------
    packages-test:
        name: Packages / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Exclusions rather than an inclusion list, so a new workspace that
            # declares `test` is covered without editing this job. The five
            # excluded here run in dedicated jobs: web, internal and dev-tools,
            # and the two persistence packages that share Data & Storage / Test.
            - name: Test
              run: pnpm -r --filter "!@virtool/web" --filter "!@virtool/data" --filter "!@virtool/storage" --filter "!@virtool/internal" --filter "!@virtool/dev-tools" test

    # -------------------------------------------------------------------------
    # Data and Storage (packages/data, packages/storage)
    # -------------------------------------------------------------------------
    data-storage-test:
        name: Data & Storage / Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup
              uses: ./.github/actions/setup
            # Its own job rather than part of Packages / Test: data starts a
            # Postgres testcontainer and storage starts Garage and Azurite,
            # and pulling those images does not belong in the fast package
            # loop. The two persistence packages share one job, run with
            # --parallel so their testcontainer pulls overlap despite the
            # data-on-storage dependency, and neither fills the job's
            # wall-clock budget.
            - name: Test
              run: pnpm --parallel --filter @virtool/data --filter @virtool/storage test
              env:
                  TZ: UTC

    # -------------------------------------------------------------------------
    # Changeset (pull requests)
    # -------------------------------------------------------------------------
    # Fails a pull request that changes a versioned workspace without adding a
    # changeset. `changeset status --since` exits 1 when a changed package has
    # no changeset and passes cleanly when nothing versioned changed, so a
    # docs- or CI-only pull request is unaffected. A change that intentionally
    # ships nothing to users records that with an empty changeset
    # (`pnpm changeset --empty`).
    changeset-check:
        name: Changeset
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # The version PR consumes the changesets it releases, so it would fail.
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Setup
              uses: ./.github/actions/setup
            # `--since` resolves the base branch as a local ref; the pull-request
            # checkout only brings the head, so fetch main first.
            - name: Status
              run: |
                  git fetch --no-tags origin main
                  pnpm changeset status --since=origin/main

    # -------------------------------------------------------------------------
    # Release
    # -------------------------------------------------------------------------
    # On push to main, `changesets/action` maintains a "Version Packages" pull
    # request while unreleased changesets exist; merging that pull request lands
    # the version bumps with no changesets left, and the next push runs the
    # `publish` script, which tags each bumped workspace (`@virtool/web@1.2.3`).
    # `release-ghcr-matrix` reads the tagged packages and `release-ghcr`
    # publishes only the deployable apps among them.
    release:
        name: Release
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs:
            [
                build,
                build-nuvs,
                build-pathoscope,
                checks,
                data-storage-test,
                docs-lint,
                internal-test,
                nuvs-test,
                packages-test,
                pathoscope-test,
                quality-test,
                site-build,
                web-test,
                web-test-a11y,
                web-test-server,
            ]
        if: github.event_name == 'push'
        outputs:
            published: ${{ steps.changesets.outputs.published }}
            published-packages: ${{ steps.changesets.outputs.published-packages }}
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # `changeset tag` skips a package whose tag already exists, so
                  # publishing needs the full tag history, not the default
                  # shallow checkout.
                  fetch-depth: 0
            - name: Setup
              uses: ./.github/actions/setup
            - name: Changesets
              id: changesets
              # The version PR is opened with `GITHUB_TOKEN`, so its CI runs wait
              # for a maintainer to approve them. `changeset tag` writes tag events
              # to the action's output file, which it reads to push the tags,
              # create a GitHub Release per tag, and set `published-packages`.
              uses: changesets/action@v2.1.2
              with:
                  version-script: pnpm changeset version
                  publish-script: pnpm changeset tag
                  pr-title: "chore: version packages"
                  commit-message: "chore: version packages"
    release-ghcr-matrix:
        name: Release / Matrix
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs: [release]
        if: needs.release.outputs.published == 'true'
        outputs:
            include: ${{ steps.matrix.outputs.include }}
            any: ${{ steps.matrix.outputs.any }}
        steps:
            # Map the tagged packages to image builds, dropping any that are not
            # a deployable app (a shared `packages/*` bump tags a package but
            # ships no image). Keep this map in step with the `build` and
            # `release-ghcr` matrices.
            - name: Build matrix
              id: matrix
              env:
                  PUBLISHED: ${{ needs.release.outputs.published-packages }}
              run: |
                  include=$(jq -c '
                    {
                      "@virtool/web":                {image:"web",                target:"dist"},
                      "@virtool/internal":           {image:"internal",           target:"internal"},
                      "@virtool/create-sample":      {image:"create-sample",      target:"create-sample"},
                      "@virtool/create-subtraction": {image:"create-subtraction", target:"create-subtraction"},
                      "@virtool/pathoscope":         {image:"pathoscope",         target:"pathoscope"},
                      "@virtool/nuvs":               {image:"nuvs",               target:"nuvs"}
                    } as $apps
                    | [ .[]
                        | . as $p
                        | $apps[$p.name] as $m
                        | select($m != null)
                        | $m + {
                            package: $p.name,
                            version: $p.version,
                            tag: ($p.name + "@" + $p.version),
                            images: ("ghcr.io/virtool/" + $m.image)
                          }
                      ]' <<< "$PUBLISHED")
                  echo "include=$include" >> "$GITHUB_OUTPUT"
                  if [ "$(jq 'length' <<< "$include")" -gt 0 ]; then
                      echo "any=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "any=false" >> "$GITHUB_OUTPUT"
                  fi
    release-ghcr:
        # No `${{ matrix.image }}` in the name: this job's `if` is false on
        # every PR (it only runs post-merge, on push to main), and GitHub
        # skips a job before expanding its matrix — so a matrix-templated
        # name would render as the literal, unresolved expression on every
        # PR's checks list instead of a real image name.
        name: Release / GHCR
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        needs: [release, release-ghcr-matrix]
        if: github.repository_owner == 'Virtool' && needs.release-ghcr-matrix.outputs.any == 'true'
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            # Only the deployable apps whose version bumped this release, built
            # from `release-ghcr-matrix`. The pathoscope and nuvs legs read the
            # gha cache under the same scope build-pathoscope and build-nuvs
            # write it to (matching pathoscope-test's bowtie2 scope too), so the
            # release reuses what those 45/60-minute jobs already produced
            # rather than rebuilding the Rust crate, the bioinformatics tools
            # and SPAdes from scratch inside this job's shared 20-minute timeout.
            matrix:
                include: ${{ fromJSON(needs.release-ghcr-matrix.outputs.include) }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ matrix.tag }}
            - name: Setup
              uses: ./.github/actions/setup
            - name: Prepare image context
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              run: |
                  pnpm --filter ${{ matrix.package }} build
                  pnpm --filter ${{ matrix.package }} --prod deploy .docker-build/${{ matrix.image }} --force
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build & Push
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
              run: |
                  docker buildx bake -f packages/image-build/docker-bake.hcl ${{ matrix.image }} --push \
                      --set '${{ matrix.image }}.tags=${{ matrix.images }}:${{ matrix.version }}' \
                      --set '${{ matrix.image }}.tags+=${{ matrix.images }}:latest' \
                      --set '${{ matrix.image }}.cache-from=type=gha,scope=${{ matrix.image }}' \
                      --set '${{ matrix.image }}.cache-to=type=gha,mode=max,scope=${{ matrix.image }}' \
                      --set '${{ matrix.image }}.secret=id=sentry_auth_token,env=SENTRY_AUTH_TOKEN'
