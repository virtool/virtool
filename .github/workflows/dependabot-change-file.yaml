name: Dependabot

# Dependabot writes no change files, so its npm and Node base-image bumps would
# fail the `Changeset` check and never release. This adds one change file to
# each pull request, with the pull request title as its summary, rewritten as a
# release note:
#
# - A bump that changes the `package.json` or Dockerfile of a workspace
#   releases a patch of each Knope package that the workspace reaches through
#   the workspace graph, which is what the check counts as affected.
# - A bump that reaches only the root `package.json` or workspaces that ship no
#   image, such as a lint tool or the product website, ships nothing, so no
#   change file is written.
# - A bump that changes only the lockfile, such as a transitive security
#   update, names no workspace, so it releases every Knope package.
#
# `pull_request_target` runs with the base branch's secrets, so the job can
# push to Dependabot's branch. It never installs or runs code from that branch:
# it reads the diff and the workspace `package.json` files, reads `knope.toml`
# from the base commit, and writes one Markdown file. A change file that is not
# in Knope format, such as one written before the move to Knope, is replaced.
#
# A commit pushed with `GITHUB_TOKEN` never starts CI, so the push is made as
# the `virtool-releaser` GitHub App.
on:
    pull_request_target:
        types: [opened, synchronize, reopened]
        branches:
            - "main"

permissions:
    contents: read

jobs:
    change-file:
        name: Add change file
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        if: >-
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            (startsWith(github.event.pull_request.head.ref, 'dependabot/docker/') ||
            startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/'))
        steps:
            - name: Token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASER_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
                  permission-contents: write
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}
                  persist-credentials: true
            - name: Write change file
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  set -o pipefail
                  file=".changeset/dependabot-${PR_NUMBER}.md"
                  # Succeeds when the file has `name: type` front matter that
                  # names at least one package.
                  is_knope_change_file() {
                      awk '
                          { sub(/\r$/, "") }
                          NR == 1 { if ($0 != "---") { bad = 1; exit } next }
                          /^---$/ { closed = 1; exit }
                          /^[a-z0-9-]+: (major|minor|patch)[ \t]*$/ { count++; next }
                          { bad = 1; exit }
                          END { exit bad || !closed || count == 0 }
                      ' "$1"
                  }
                  if [[ -f "$file" ]] && is_knope_change_file "$file"; then
                      exit 0
                  fi
                  # A branch made before a change to `knope.toml` carries the
                  # old one.
                  knope_toml="$RUNNER_TEMP/knope.toml"
                  git show "${BASE_SHA}:knope.toml" > "$knope_toml"
                  # Prints the Knope package whose `versioned_files` lists the
                  # `package.json` in each directory read from stdin.
                  knope_packages() {
                      while read -r dir; do
                          awk -v file="\"${dir}/package.json\"" '
                              /^\[/ { name = "" }
                              /^\[packages\./ { name = $0; gsub(/^\[packages\.|\]$/, "", name) }
                              name != "" && /^versioned_files/ && index($0, file) { print name }
                          ' "$knope_toml"
                      done
                  }
                  # A bare `*` in a git pathspec also matches `/`, so these
                  # patterns reach every manifest and Dockerfile in the tree.
                  manifests=$(
                      git diff --name-only "$BASE_SHA"...HEAD -- \
                          '*package.json' '*Dockerfile'
                  )
                  if [[ -z "$manifests" ]]; then
                      if git diff --quiet "$BASE_SHA"...HEAD -- pnpm-lock.yaml; then
                          packages=""
                      else
                          packages=$(sed -nE 's/^\[packages\.([^]]+)\]$/\1/p' "$knope_toml")
                      fi
                  else
                      # The changed workspaces and every workspace that
                      # depends on them, as `pnpm --filter "...[ref]"` finds.
                      changed=$(
                          for manifest in $manifests; do
                              dir=$(dirname "$manifest")
                              if [[ "$dir" == apps/* || "$dir" == packages/* ]] && [[ -f "$dir/package.json" ]]; then
                                  jq .name "$dir/package.json"
                              fi
                          done | jq -s .
                      )
                      packages=$(
                          for manifest in apps/*/package.json packages/*/package.json; do
                              jq -c --arg dir "$(dirname "$manifest")" '{
                                  name,
                                  dir: $dir,
                                  deps: [(.dependencies, .devDependencies, .optionalDependencies, .peerDependencies) // {} | keys[]]
                              }' "$manifest"
                          done |
                              jq -rs --argjson changed "$changed" '
                                  . as $all
                                  | def reach($names):
                                      ($names + [$all[] | select(any(.deps[]; IN($names[]))) | .name] | unique) as $next
                                      | if $next == $names then $names else reach($next) end;
                                  reach($changed | unique) as $names
                                  | $all[] | select(IN(.name; $names[])) | .dir
                              ' |
                              knope_packages |
                              sort -u
                      )
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if [[ -z "$packages" ]]; then
                      # The bump ships nothing, so an old change file goes.
                      if [[ -f "$file" ]]; then
                          git rm --quiet "$file"
                          git commit -m "Remove change file"
                          git push
                      fi
                      exit 0
                  fi
                  # Titles read `chore(deps): bump <name> from X to Y` or
                  # `chore(deps): bump the <group> group ...`. Drop the commit
                  # type, capitalize, and quote the package name as code so
                  # Vale doesn't lint it as prose.
                  summary=$(
                      sed -E \
                          -e 's/^[a-z]+(\([^)]*\))?!?: *//' \
                          -e 's/^bump /Bump /' \
                          -e 's/^Bump ([^ ]+)/Bump `\1`/' \
                          -e 's/^Bump `the`/Bump the/' \
                          <<< "$PR_TITLE"
                  )
                  {
                      echo "---"
                      for package in $packages; do
                          echo "${package}: patch"
                      done
                      echo "---"
                      echo
                      echo "${summary}."
                  } > "$file"
                  git add "$file"
                  git commit -m "Add change file"
                  git push
