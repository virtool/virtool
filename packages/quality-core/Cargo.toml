[package]
name = "quality-core"
version = "0.0.0"
edition = "2021"
description = "FastQC-equivalent read quality statistics, as a standalone CLI"
license = "MIT"
publish = false

# A plain executable. The workflow invokes it as a subprocess; there is no
# FFI and no cdylib.
[[bin]]
name = "quality-core"
path = "src/main.rs"

# The library target exists so the modules' own `#[cfg(test)]` blocks compile
# and run against them directly under `cargo test`.
[lib]
name = "quality_core"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# gzip only. The default feature set adds bzip2, xz and zstd, each of which
# links a C library this crate would then need in every image that copies the
# binary — and a FASTQ upload is gzipped or plain, never any of the three.
needletail = { version = "0.7", default-features = false, features = ["flate2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.0"
