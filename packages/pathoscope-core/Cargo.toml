[package]
name = "pathoscope-core"
version = "0.0.0"
edition = "2021"
authors = ["Markus Swoveland"]
description = "Pathoscope's expectation-maximization core, as a standalone CLI"
license = "MIT"
publish = false

# A plain executable. The workflow invokes it as a subprocess; there is no
# FFI and no cdylib.
[[bin]]
name = "pathoscope-core"
path = "src/main.rs"

# The library target exists so the modules' own `#[cfg(test)]` blocks compile
# and run against them directly under `cargo test`.
[lib]
name = "pathoscope_core"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rust-htslib = "0.47"
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3.0"
